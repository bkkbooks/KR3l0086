body:
  text: 菽園雜記卷九明陸容撰陳宗訓者太宜人之伯父涉獵書史事母盡孝每飲食親友家遇時新品味母未嘗必託以疾忌不一下箸翌旦必入城布買以奉母或逺方難得之物可懷者必懷歸母心樂之至老不衰太宜人事先祖母曲盡孝謹有自來矣雎鳩揚雄許慎以為白鷢郭璞以江東人謂之鶚陸機以幽州人謂之鷙黃公紹譏其皆以意求之斷以為即今之杜鵑云自蜀人作華陽國志妄稱望帝所化遂有杜鵑杜宇之名而雎鳩王睢世反不識此正以五十步笑百步者也惟朱子詩傳云狀類鳬鷖最為得之今吳音訛呼睢為竪婚禮好事者必求鴛鴦王睢以備名件蓋非尚珍異鴛鴦取其匹而有恩王睢以其摯而有别也文武諸司之設各有正官主之如五軍都督府則左右都督通政司則通政使大理太常鴻臚光祿等寺則各寺卿國子監則祭酒太醫院則本院使欽天監則本監正上林苑監則左右監正是也近年各以尊官處之中軍都督府英國公張懋右軍都督府保國公朱永皆太子太傳左軍都督府定西侯蔣琬前軍都督府新寧伯談祐後軍都督府襄城侯李瑾皆太子太保通政使司張文質太常寺劉岌鴻臚寺施純皆太子少保禮部尚書大理寺工部尚書杜銘光祿寺艾福國子監丘濬欽天監康永韶皆禮部侍郎太醫院則通政使蔣宗武上林苑監則右通政李孜省此亦制度之一變也成化乙巳記癸辛雜識云官品有金紫銀青之目蓋金至於紫銀至於青為絶品也此説殆非蓋金銀謂印青紫謂綬或謂所佩魚袋及服色耳古人有金章紫綬紫袍今時文武極品官俱無金印印亦無綬又紫為禁色臣下無敢服者惟四品以上緋袍金帶七品以上青袍銀帶此即金紫銀青之遺制也巡撫官永樂間已有之然僅設於要處耳洪熙宣德初年添設漸多侍郎通政大理寺卿惟其人不皆都御史也景泰以來悉置都御史初意蓋以御史在外多浮薄不遜以此軋之耳以今計之亦太盛矣蘇松等處鳳陽等處宣府等處順天等府保定等府延綏等處甘肅等處河南山東山西遼東大同寧夏陜西湖廣江西兩廣雲南四川貴州福建凡二十人內署銜不同者兩廣曰總督軍務蘇松等處曰總理糧儲鳳陽等處曰總督漕運遼東湖廣雲南皆曰贊理軍務山西曰提督鴈門等關保定曰提督紫荆等關順天等府曰整飾薊州等處兵備餘止稱巡撫鄖陽等處曰撫治蓋主流民也凡推舉各邉及腹裏干涉軍務者吏兵二部會同干涉錢糧流民者吏户二部會同惟總督漕運者吏戶兵三部會同江西福建山東地方有事則設事寧則革之各處總兵官印文宣府曰鎮朔將軍大同曰征西前將軍延綏曰靖邊副將軍寧夏曰征西將軍甘肅曰平羌將軍雲南曰征南將軍兩廣曰征蠻將軍湖廣曰平蠻將軍皆栁葉漕運總兵無將軍名目其印曰漕運之印疊文若陜西止稱鎮守官貴薊州等處雖名總兵俱無將軍印永樂間平江伯陳公瑄把總海運糧儲共一百萬石時未有總兵之名十三年裏河漕運加至五百萬石統各處一百七十餘衛後以湖廣浙江河南山東各都司所屬茶陵臨山彰德濟南等衛地逺省之每嵗止運四百萬石洪熙元年始充總兵官督運鎮守淮安此設總兵之始也宣德四年用工書黃福計議於徐州等處立倉令官軍接運六年挂漕運之印八年公薨以都督僉事王瑜都指揮僉事吳亮充左右副總兵同管正統四年専以馬興充總兵湯節充參將此設參將之始也景泰二年設左僉都御史王竑同管此文臣總督漕運之始也欽天監官例不致仕老死而後已天文生由科目出仕者只於本衙門任用不令出任府州縣官蓋有深意存焉太醫院官無考滿依資格升職者蓋此流醫藥有效則奉特旨升官故也近年吏部考察京職欽天監官年六十以上者俱勒令休致罷革傳奉冗官則太醫院官皆在其列計無所出則請旨去留由是權移他手而賢否混淆矣鄉民有子患瘡疹備牲酒禱神語拙不能致詞乃要其婦翁禱之翁之孫適亦患此疾翁乃對神私語為其孫禱時壻拜於後怪其詞不揚膝行聽之知其然未敢言也俄而翁之孫愈壻之子亡壻由是甚怨之以其情訴於人人以為笑成化間一巡撫都御史被訟于朝其親有官給事中者巡撫乃以重賂托之賂中官求援給事以為己物奉以求進由是得升吏部侍郎而巡撫竟坐法戍邉死又兵部尚書缺人一兵部侍郎欲得之其親家有為刑部尚書者素稔十官遂托之納賂尚書之為已謀亦如給事於是去刑而遷兵侍郎知之恚恨疽發項死此二人與婦翁之御其壻者甚類皆可笑也南京妓女劉引靜幼為一商所養商死劉為持服嵗時修齋設祭哭泣甚哀日以女工自養誓不接客家人不能奪其志也商家後凋落且能推所有以周其妻子有富翁聞其賢欲娶焉劉不從而止京師郭士公子者故定襄伯登之從子也嘗昵一妓方妙年公子死即削髮解足紈為尼屠寶石京師大賈也嘗以罪發遣遼東充軍家破無可託者以白金萬兩寄所昵妓家後數年赦回以所寄還之封識如故世有處貴富之地而淫褻無恥當變故之時而貪昧忘義者多矣孰知風塵之中有此卓異者人性之皆善豈不信哉然則觀人者未可以其類也朝廷近建三官廟規制𢎞麗像肖莊嚴其費皆出內帑不煩有司工成日內府各內官及文武諸司大臣俱往瞻禮蓋上承母后意而羣臣將順之也兵書淶水張公問豫三官所由始嘗考之漢熹平間漢中有張修為太平道張角張魯為五斗米道而魯尤盛蓋自其祖陵父衡造符書於蜀鶴鳴山制鬼卒祭酒等號有疾者令其自書氏名及服罪之意作三道其一上之天著山上其一埋之地其一沉之水謂之天地水三官三官之名實始於此豫既以復張公且為評云水為五行之一生於天而附於地非外天地而為物也今以水與天地並列已為不通之論若其使民服罪之書水官者沉之水地官者埋之地似矣天官者既云上之天則置之雲霄之上可也却云著之山上然則山非地乎其誣惑蚩蚩之民甚矣大􅜔子中消白日小車兒上看青天此邵康節先生詩今人呼盛茶酒器為􅜔有自來矣然此字亦後人方言所增韻書無之檀弓記孔子居宋見司馬桓魋自為石槨三年而不成曰若是其靡也死不如速朽之愈也初疑所謂石槨若今合石為之不應若是其難也𢎞治戊申之春舟過徐州約三十里聞鄉人言其地有洞山寺寺下有洞為古迹甚竒乃命艤舟一登讀眉州萬閣老所撰建寺碑乃知即所謂桓山宋桓魋葬處也其隧道當南向今已在佛殿下矣佛殿後有一穴可入石槨約髙丈餘其深約五六步其廣半之兩旁又各鑿為夾室狀每處可容十人蓋四周一全山山而刳其中耳是宜三年而不成也蘇長公遊北山時蓋已蕩然金椎之餘矣今石壁所刻賦蓋後之好事者為之其稱洞山者以石槨為洞也近見二文士有三年服者同送鄉人之喪一人束孝帛一人不束人問之不束者云重不可加輕束者云斯須之敬聞者質豫當以何人為是豫曰若論小節二人皆是若論大體二人皆非蓋父母之喪雖出門弔問亦不可况可送之出郊乎今既往弔且受其帛矣及出送而曰重不加輕乎如以為禮尚往來使子弟行之可也唐詩云邵平瓜地接吾廬榖雨乾時手自鋤厯解云榖雨讀作去聲如雨我公田之雨自雨水後土膏脈動今雨其榖於水也讀為上聲者非梅聖俞河魨詩云春洲生荻芽春岸飛楊花河魨當此時貴不數魚蝦而吾鄉俗語則云蘆青長一尺莫與河魨作主客蘆青即荻芽也荻芽長河魨已過時矣而聖俞云然豫嘗疑之後觀范石湖吳郡志始知此魚至春則泝江而上蘇常江隂居江下流故春初已盛出真潤則在二月若金陵上下則在二三月之交池陽以上暮春始有之聖俞所云殆池陽當塗之俗而歐公所謂羣遊水上食絮而肥南人多以荻芽為羮則又附會之説非真知河魨者也觀屬目聞屬耳然佛書有觀其音聲之文杜詩有心清聞妙香之句正猶鳥不可以牝牡言獸不可以雄雌言書有牝雞詩有雄狐此文字中活法可以意會而不必泥也蜃氣樓臺之説出天官書其來逺矣或以蜃為大蛤月令所謂雉入大海為蜃是也或以為蛇所化海中此物固多有之然濵海之地未嘗見有樓臺之狀惟登州海市世傳道之疑以為蜃氣所致蘇長公海市詩序謂其嘗出於春夏嵗晚不復見公禱于海神之廟明日見焉是又以為可禱而得則非蜃氣矣遼東志云遼東東南皆山也其峯巒疊翠蔥蒨可觀當夏秋之交時雨既霽旭日始興其山嵐凝結而城郭樓臺草木隱映人馬馳驟於煙霧之中宛若人世所有雖丹青妙筆莫盡其狀古名登萊海市謂之神物幻化豈亦山川靈淑之氣致然邪觀此則所謂樓臺所謂海市大抵皆山川之氣掩映日光而成固非蜃氣亦非神物東坡之禱蓋偶然耳且詩中有云朝陽太守南遷歸喜見石廩堆祝融自言正直動山鬼豈知造物哀龍鍾其自負亦不淺矣况此老素善謔又安知非自神其事以鳴其不平邪虞邵菴作朱澤民母吉宜人墓碣有云至元甲午吉宜人將就館其姑施夫人疾病歎曰吾婦至孝天且賜之佳子吾必及見之既而疾且亟治後事其大父卜地陽抱山之原使穿壙以為藏施夫人曰異哉吾夢衣冠偉丈夫來告云勿奪吾宅吾且為夫人孫既而役者治地深五尺得石焉封曰太守陸君績之墓别有刻石在旁曰此石爛人來換石果斷矣其祖命亟掩之而更卜兆地夫人又夢偉衣冠者復來曰感夫人盛德真得為夫人孫矣德潤生其大父字之曰順孫而施夫人沒人以為孝感所致德潤澤民名也澤民仕元為征東行省儒學提舉今朱文天昭御史之髙祖審如是則澤民乃陸公績後身也豫嘗觀前代探環覓刀等事猶未之信今觀此文則知天地間異聞不可謂盡無也楊鐵崖國初名重東南從遊者極其尊信觀其正統辨史鉞等作皆善已若香奩續奩二集則皆淫褻之詞子始疑其少年之作或出於門人子弟濫為筆録耳後得印本見其自序至以陶元亮賦間情自附乃知其素所留意也按間情賦有云尤蔓草之為會誦召南之餘歌蓋發乎情止乎禮義者也鐡崖之作去此逺矣不以為愧而以之自附何其悍哉香奩續奩惟崑山有刻本後又有楊東里跋語玩其辭氣斷非東里之作蓋好事者盜其名耳記此以俟知者魏將軍某年七十餘披甲上殿及隨鑾輿出入不減少年人問其平生事云年四十五時已絶男女之欲周和尚廬陵人流落京師年九十餘逺路能步行鬚髮不白豫嘗問其得何修養之術云無他術自壯年能節欲耳且云人之精液度與女子能生人若能保守存留豈不能資生自身太倉畫士張翬年九十餘耳聰目明猶能作畫嘗問其何修而致云平生惟欲心頗淡欲事能節或者賴此耳無他術也毗陵謝應芳子蘭嘗論三髙祠不當祠范蠡云季鷹魯望吳産也吳人視為東家丘是已鴟夷子皮始終事越間以行成留吳其心未嘗一日忘乎越也進美女獻寶器以惑吳之君臣乘虛進兵以滅吳之宗社大率皆蠡之謀越人論功蠡居第一豈非吳之大仇乎惟其功成名遂遁迹而去其識見固髙於常人然浮海之裝捆載珠玉在齊復營致千金之産自齊居陶父子耕畜轉物逐利復積畜纍巨萬太史公前後不一書者蓋深鄙之非美之也較諸子房辭漢翛然從赤松子之遊相去多矣杜牧之蘇子瞻皆謂蠡私西施以申公夏姬為比由是觀之謂其人為貪為穢亦不為過尚何風節足慕乎今也以吳人馨香之黍稷享敵國貪穢之仇讎於理其可乎哉禮云民不祀非族况仇敵乎吳有三髙人特未之思耳若泰伯仲雍延陵季子真天下所共高者也凡為吳人苟非土木孰不有髙山景行之思宜尊三讓至德之聖祠於堂上配以二賢仍以季鷹魯望列之從祀如此則正前人之謬戾新斯民之耳目振髙風崇禮讓激衰世薄俗而勸之於風化豈小補哉若謂蠡有功而祀之則越人祀之宜矣如諸葛武侯之賢蜀人祀之吳魏未嘗有祠焉斯理之公古今一致所謂質諸鬼神而無疑者也此言具子蘭上饒參政書自志云方議移文有司會世變而止按此言蠡事大率皆前人所闕其言吳有三高人未之思一假則前人所未發也先儒謂詩傳有本韻不必叶而叶者今細察之信然如吉日三章其祁孔有或羣或友悉率左右皆叶羽已然有友右皆從又吳人自來呼又為以音但不通於天下耳不必叶也又如隰桑遐不謂矣傳云遐與何同若以聲音相同則今常熟吳音稱何人為遐箇是已其引鄭氏云遐之言胡也則又以義不以音矣巡撫周文襄公初至崑山甫登岸盛怒撻一人儒學教諭朱冕叱皂隸令止進白公曰請姑息怒至衙門治之可也公從之至寓府入見後公召冕問故對曰下車之初觀曕所繫恐因怒傷人纍盛德耳公謝之未幾太倉開設衛學公奏保冕為教授且語二衛武職云吾為爾子弟得一良師宜隆重之冕字士章嘉興人在崑庠時季考月試賞罰明信弟子多所作成至今論師道者必首稱之詳見葉文莊公水東日記嘗聞中官談漢府事因問漢庶人所終云初庶人被執鎖縶逍遙城一日宣廟欲往觀左右止之不聽及至熟視久之庶人出其不意伸一足勾上仆地左右急扶起久而神思乃寧始自悔亟命壯士舁銅缸至覆之缸約重三百斤猶覺頂負而動積炭圍缸外乃然炭逾時火熾銅鎔庶人亦不知其處矣成化二十一年乙巳二月初五日丑時泰山微震三月一日丑時大震本日戍時復震初五日丑時復震十三日十四日相繼震十九日連震二次考之自古祥異所未聞也凡軍前紀功南蠻首三級為一功凡婦人首級受賞而已不升官恐以女首充數莫能辨也嘗遇都督馬儀談及此儀云辨之亦有法紀功多文臣不知此法耳苐投水中仰者婦人俯者男子豫嘗聞水中浮尸男俯女仰此隂陽定體之妙雖人力翻覆之終歸其舊未知人首亦然儀在邊最久必嘗試知其然也積書不能盡讀而不吝人借觀亦推已及人之一端若其人素無行當謹始慮終勿與可也世有借書一癡還書一癡之説此小人謬言也癡本作瓻貯酒器言借時以一瓻為贄還時以一瓻為謝耳以書借人是仁賢之德借書不還是盜賊之行豈可但以癡目之哉通政司所以出納王命為朝廷之喉舌宣達下情廣朝廷之聰明於政體關係最重也洪武永樂間實封皆自御前開拆故姦臣有事即露無幸免者自天順間有投匿名奏本言朝廷事者於是始有關防然其時但拘留進本人在官候旨意出即縱之未嘗窺見其所奏事也後不知始於何年乃有拆封類進及副本備照之説一有訐奏左右內臣及勳戚大臣者本未進而機已泄被奏者往往經營幸免原奏者多以虛言受禍祖宗關防姦黨通達下情之意至是無復存矣可勝嘆哉成化末年太監梁芳輩導引京師富賈收買古今玩器進奉啓上好貨之心由是幸門大開金夫子弟各以珍異投獻求進而無名乃於各寺觀聚寫釋道星命等書進呈遂得受職內原任中書序班者得升職至太常鴻臚太僕少卿等階白身人得受鴻臚主簿序班等職生員儒士匠丁樂工勳戚厮養凡髙資者皆與並進名曰傳奉蓋命由中出不由吏部銓選故名名器之濫無踰此時未幾以星變修弭廷議革之稽其數原有職傳升者三十六人白身授職者五百三十八人悉革職勒令原籍間住不再録用軍職傳升者數當倍蓰未暇籍也鴨腳樹實如杏而其核中之仁可食故曰仁杏今云銀杏是似而非也陸展染白髮以媚妾冦凖捉白鬚以求相皆溺於所欲而不順其自然者也然張華博物志有染白鬚法唐宋人有鑷白詩是如此風其來逺矣然今之媚妾者蓋鮮大抵皆聽選及戀職者耳吏部前粘壁有染白鬚髮藥修補門牙法觀此可知矣菽園雜記卷九
