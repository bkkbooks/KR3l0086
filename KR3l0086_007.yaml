body:
  text: 菽園雜記卷七明陸容撰豫為庠生時嘗以家難赴訴前巡撫崔莊敏公公以瞽叟殺人舜竊負而逃遵海濵而處當是時也愛親之心勝其於直不直何暇計哉一節為題命作講義公初讀破題喜及讀至結尾有云使葉公而知此其肯以證父攘羊之為直使漢高而知此其肯貪天下而分羮於敵國哉乃益喜稱賞之豫時亦以為偶有新得也近得楊廉夫樂府有杯羮詞鄭于美文集有索羮論乃知此義古人先得之矣鄭論云項羽置太公於爼上告高祖而殺之高祖於此所宜卑辭請降迎歸其父然後以項羽既弒其君又欲殺人之父以挾其子興師問罪與之决勝負於一戰定成敗於萬全未晚也豈可大言無當索父之羮以吾親之重為天下之一擲哉向非項羽有婦人之仁高祖有項伯之援則太公烹於爼上矣項羽既殺太公分羮高祖然後布告天下謂高祖不顧其父挾人殺之而食其羮興師問罪則高祖負殺父之名此身且將無所容於天地之間又安能與之爭天下哉項羽既不知出此反惑於為天下者不顧其家之言使太公幸而獲免高祖因之成事天下遂以高祖為得計索羮為名言紊綱常之義失輕重之權矣末乃引孟子答桃應之問結之此前人所未道也本朝中官自正統以來專權擅政者固嘗有之而傷害忠良勢傾中外莫如太監王振然宣德年間朝廷遣取花木鳥獸及諸珍異之好內官接跡道路騷擾甚矣自振秉內政未嘗輕差一人出外十四年間軍民得以休息是雖聖君賢相治效所在而內官之權振實攬之不使泛濫四及天下隂受其惠多矣此亦不可掩也楊文定公溥在內閣時其子來自石首備言所過州縣官迎送餽遺之勤南京吏部侍郎范公理時知江陵縣頗不為禮公聞而異之後廉知其賢即薦知德安府其為縣才八月而已商文毅公輅自內閣罷官歸工部侍郎杜公謙時為主事治水吕梁遇之獨厚商後被召復職每汲引之白恭敏公圭任浙江布政使過徐州洪家人與水手相毆主事𡊮規收其儀仗懇請而解未幾召為工部侍郎𡊮不自安而公未嘗形於辭色少保于公謙為兵部尚書時葉文莊公在兵科屢劾之後喪偶請于為墓志慨然成之李文逹公之於文莊聞人譖其議已則深銜之且抑之至其沒文莊始得入為禮部其不同如此江南巡撫大臣惟周文襄公忱最有名蓋公才識固優於人其留心公事亦非人所能及聞公有一冊厯自記日行事纎悉不遺每日隂晴風雨亦必詳記如云某日午前晴午後隂某日東風某日西風某日晝夜雨人初不知其故一日民有告糧船失風者公詰其失船為何日午前午後東風西風其人不能知而妄對公一一語其實其人驚服詐遂不得行於是知公之風雨必記蓋亦公事非漫書也還元水者臘月以空瓶不拘大小細布緘其口引之以索浸糞厠中日久糞汁滲入瓶滿自沉取埋土中二三年化為清水略無臭氣凡毒瘡初發時取一碗飲之其毒自散此法聞之沈通理先生嘗試之有效凡咽喉初覺壅塞一時無藥以紙絞探鼻中或嗅皂角末噴嚏數次可散熱毒仍以李𣗳近根皮磨水塗喉外良愈輟耕録言嬸妗字非古吳音世母合而為嬸舅母合而為妗耳此說良是今吳中鄉婦呼阿母聲急則合而為黯輕躁之子呼先生二字合而為襄但未有此字耳又如前人謂語助爾即而已字反切楚辭些即娑訶字反切今以類推之蜀人以筆為不律吳人以孔為窟隴又如古人以瓠為壺詩八月斷壺是已今人以為葫蘆疑亦諸字之反切耳世俗相傳以三月二十八日為東嶽生日然不見於紀載許文闕公彬重修蒿里祠記云每年三月二十八日屬東嶽帝君誕辰天下之人不逺千數百里各有香帛牲牢來獻夫二儀既分五嶽以峙非今日生一山明日生一山有月日次第可記而謂之生日也其妄誕不辨而明矣不知許公何所據而書之石乎然其文集中無此篇殆它人依託者韻書云楚莊王滅陳為縣縣之名自此始此說非也周禮小司徒有云九夫為井四井為邑四邑為丘四丘為甸四甸為縣又遂人云五家為鄰五鄰為里四里為鄼五鄼為鄙五鄙為縣則縣之名先已有之但與今縣制不同耳或謂郡縣自秦漢始亦非也周制地方千里分為百縣縣有四郡上大夫受縣下大夫受郡秦廢封建之制置三十六郡以監天下之縣漢因而增置郡國六十七郡之名亦先有之特古今制度不同大小敻異耳前代史凡事更時未久曰亡何曰居亡何曰居亡幾何曰未幾其最近者曰頃之曰少選曰為間曰已而曰既而至宋人作唐書事或踰年或數月或數日率用俄而字後人效之如叙宋太祖太宗授受之際一則曰俄而殂一則曰俄而帝崩以致燭影斧聲之疑紛紛異說嘗考之開寶九年冬十月壬子帝以後事屬晉王癸丑夕崩於萬嵗殿太祖夜召晉王時夜已四鼓蓋前後二夕而曰俄而一字不當害事如此叙事之文可不慎歟俞貞木字有立錢芹字繼忠皆蘇人革除年間蘇守姚善好禮賢士有立以明經見重於守月朔望必延致講書府學嘗令吏饋米於有立誤送繼忠吏惶恐白守將取還有立云錢先生與人不茍合尤不茍取與今受米不辭必知公之賢耳守驚異即令人請見繼忠對使者云吾為郡民有召敢不赴但吾心未宿戒不可輕往他日可也他日浣濯衣冠齊沐而往守甚喜延之别室請問經義繼忠云此士子之務耳公為政何不談時務而及此邪守益起敬遂問今日何者為急務繼忠令屏左右云今日之務勤王為急守躍然而悟於是密結鎮常嘉松四郡守訓練其民率先赴行竟死其事户部尚書夏忠靖公原吉長沙人德量寬厚喜怒不形永樂間嘗以治水至崑山寓千墩禪寺所居不設儀從鄉民數人入寺遊觀公方坐室中觀書不意其為夏公也雜坐其旁既而它之問僧云尚書何在僧云室中觀書者是也民懼乃奔去公好食煼豬肝一日膳夫供具公飯盡而肝如故怪之已而分食乃知入鹽過多鹹不可食也人服其量楊東里作公神道碑記𨽻汚織金賜衣吏碎所愛硯皆無怒意謂其有王子明韓稚圭之度非過稱也丈量田地最是善政若委託得人奉公量見頃畞實數使多餘虧缺各得明白則餘者不至暗損貧寒缺者不至虛陪糧稅弊除而利興矣周文襄巡撫時嘗有此舉以屬户部主事何寅寅日惟耽酒未嘗遍歷田野親視丈量秪慿里胥輩開報輒與准理丈量稍多分毫者必謂之積出比原數虧缺者皆謂之量同更不開虧缺一項如太倉城中軍民居址街衢河道俱作納糧田地量至北郊二十七保多出田畞若干將內二頃九十三畝有竒撥與太倉學收租蓋縮於城市而伸於郊墟故有此積出非原額之外田也别處量出多餘者則以送京官之家自正統初至今量同者納無地之糧京官家享無稅之利是雖何寅貽患於民而文襄安於成案不察其弊蓋亦不能無責也寅廣東南海人嘗問其家世已蕩然矣或者為官不忠所事之報耶府官之制始於秦立郡守郡尉郡丞郡監之官漢因秦制罷郡監以丞相史分刺屬郡謂之刺史景帝改郡守稱太守郡屬有司馬之官後漢有郡主簿五官掾五官掾者兼置功曹户曹决曹賊曹倉曹是也晉齊梁陳竝因之隋改刺史為總管以長史司馬録事參軍東西曹掾司功司兵司倉司土司馬司法司户諸參軍為參佐而省治中别駕焬帝改總管為太守改長史司馬為通守贊治尋改贊治為郡丞唐改太守為總管又改總管為都督省郡丞置别駕長史餘悉因隋制景雲初罷州都督為刺史天寶元年改刺史為守乾元元年升州刺史為節度使大厯五年改節度使為觀察使宋以知州大都督之御其官屬有通判長史司馬簽判判官掌書記推官支使録事司户司法司土司理參軍政和間置司儀司兵司功與司録司户司土司刑為州七曹宣和間改州為路設安撫使都總管兼本路鈐轄紹興初改州為府以知州為知府設通判三貟罷司儀司兵司功諸曹官元改府為路設達嚕噶齊總管同知治中判官推官經歷知事照磨提控案牘譯史及録事司達嚕噶齊録事判官各一貟本朝改路為府革達嚕噶齊治中提控案牘譯史録事改總管為知府判官為通判而同知推官經歷知事照磨皆仍其舊檢校則建置云今世富家有起自微賤者往往依附名族誣人以及其子孫而不知逆理忘親其犯不韙甚矣吳中此風尤甚如太倉有孔淵字世升者孔子五十三世孫其六世祖端越仕宋南渡至其父之敬任元通州監稅徙家崑山元祐初州治遷太倉新作學宫世升多所經畫遂攝學事號莘野老人子克讓孫士學皆能世其業士學家甚貧常州某縣一富家欲求通譜士學力拒之歿後無子家人不能自存富家乃以米一船易譜去以此觀之則聖賢之後為小人妄冒以欺世者多矣周瑛良石知廣德州時作祠山雜辨其辨埋藏一事云按埋本作貍周禮以貍沈祭山川注云祭山林則貍之祭川澤則沈之是埋藏者本山澤之祭也其曰今夜埋藏及旦皆無有過言耳考諸本集志埋藏事謂坎地深廣各五尺凡祭物皆三百六十舁置坎中蒙以太牢之皮反土而平治之土不見􅑿餘或加縮於初及久後埋藏或值其故穴皆不見其中所有此說未為無理蓋土不見􅑿餘者平治之也或加縮於初者物腐而土陷也久後埋藏不見中所有者物化也今盜發古塜皆不見其中所有者亦化也人言地熱則速化埋藏易化地熱故也道流欲神異之故為過言以駭愚俗耳所云本集蓋祠山舊有指掌集良石按而辨之布衣沈鑒文昭記覽博洽而放言自廢時目為沈落魄或問云今之居大位享大福者未必有學問有學問者多是貧賤無福何也文昭云有學問便是福何須富貴老僧惟寅嘗云讀書要有福無福者讀書不成如人家子弟有志讀書若無衣食之憂户役之擾疾病之纍以奪其心便是有福縱使無憂於衣食無擾於户役若身常有疾則不能遂志即是無福此等議論皆有理前代賜諸侯有湯沐邑賜公主有脂粉田而皇莊則未聞也今所謂皇莊者大率皆國初牧地及民田耳嵗計之入有內官掌之以為乘輿供奉然國家富有天下尺地莫非其有倉廪府庫莫非其財而又有皇莊以為已有此固衆人所不識也聞大臣中惟彭文憲嘗言之其疏留中不出而言官不聞有議乞革罷者何邪或云正統天順間尚無之瞿世用御史巡按廣東時嘗寢疾卧內有堊壁一堵一夕幻出山水圖世用心怪之然猶疑病中眼花妄有所見召縣官入視皆以為畫也乃命以墨塗之𨼆𨼆猶見筆跡後數日才滅世用病尋愈亦無他京師閭閻多信女巫有武人陳五者厭其家崇信之篤莫能制一日含青李於腮紿家人瘡瘇痛甚不食而卧者竟日其妻憂甚召女巫治之巫降神謂五所患是名丁瘡以其素不敬神神不與救家人羅拜懇祈然後許之五佯作呻喚甚急語家人云必得神師入視救我可也巫入按視五乃從容吐青李示之捽巫批其頰而出之門外自此家人無崇信者布衣李靖不揆狂簡獻書西嶽大王閣下靖聞上清下濁爰分天地之儀晝明夜昏乃著人神之道又聞聰明正直依人而行至誠感神信不虛矣伏惟大王嵯峨擅德肅爽凝威為靈術制百神配位名雄四嶽是以歷像清廟作鎮金方遐規歷代哲王莫不順時禋祀興雲致雨天實肻從轉孽為祥何有不賴嗚呼靖者一丈夫爾何得進不偶用退不獲安呼吸若窮池之魚進退似失林之鳥憂傷之心不能己巳社稷凌遲宇宙傾覆奸雄競逐郡縣大崩遂欲建義橫行雲飛電掃斬鯨鯢而清海嶽卷氛祲以闢山河使萬姓昭蘇庶物昌運即應天順人之作也又大寶不可以妄據欲杖劔竭節未有飛龍在天捧忠義之心身傾濟世志吐肝膽於階下惟神鑒之願告進退之機得遂平生之志有賽德之時終陳擊鼓若三問不對亦何神之有靈然後即靖斬大王頭焚其廟建縱橫之略亦未晚也惟神裁之右李衛公上西嶽書不見紀載喜其竒而録之聞高皇將起義隂卜於山寺伽藍神三投珓皆不許遂擊破神像而去十數年間致成大業蓋古之英雄豪傑欲建功業若衛公者必其先有定志而假鬼神以决之所謂質諸鬼神而無疑者也况帝王之興自有天命雖鬼神之靈亦莫能測其機兆則夫叢祠土偶豈能决哉天順間太監曹吉祥忠國公石亨用事勢熖炙手可熱文人武士出入其門以盜有名器者不可勝數京師有賀三老者吉祥從子都督欽之妻父也見欽聲勢日盛獨不踵其門欽嘗欲為求官力辭不可乾麵胡同口一賣餅小家生女美而豔都督石彪欲取為妾父母樂從之女獨不肻乃己未幾石氏敗彪棄市曹欽謀反凡連姻及所親者誅竄殆盡三老獨免京師有婦女嫁外京人為妻妾者初看時以美者出拜及臨娶以醜者換之名曰戳包兒有過門信宿盜其所有逃去者名曰拿殃兒此特里閈奸邪耳又有幼男詐為女子傅粉纏足其態逼真過門時乘其不意即逸去成化間嘗有嫁一監生者適無釁可逸及暮近之乃男子也執於官併其媒罪之有男詐為女師者京城內外人家留教針指後至真定一生家生往狎之力辭不許生强之乃男子遂縶之于官械送京師法司奏置極刑此皆所謂人妖也鮠魚字一作鮰味美而子有毒不减河魨子食之能殺人聞蛇亦能化鱉凡鱉在旱地得者不宜食下水則無毒矣駙馬都尉本秦漢官漢有奉車都尉主車輿駙馬都尉主駙馬騎都尉主羽林騎是謂三都尉今止稱駙馬省文耳然唐人云戚里舊知何駙馬今人數列侯云公侯駙馬伯蓋詩詞文移取便無妨若君前奏對自當稱駙馬都尉今謁陵陛辭復命皆云駙馬臣某蓋承襲謬誤莫之正耳成化庚子山西石州民家生一豬二頭二尾八足共一脊生即死王主事祿公差至其地嘗聞之知州云嘗與鄭介菴㑹飲介菴問魚餒肉敗不直曰魚爛肉腐而云然何如豫不能對因請教曰魚之爛自內始如腹之餒肉之腐自外入如軍之敗請問何出云不知所出嘗聞之先輩張伯緒如此後讀程沙隨思問録中具此說始知出於程嘗見晦菴先生稱沙隨為程丈蓋前輩也思問録於論孟多所發明同寮劉時雍言其鄉一女染竒病每中夜有物來與交日漸羸憊醫莫能治聞一道士能祛邪請治之道士求二童男沐浴更衣各授以劍作呪語噀水使舞舞將終叱之去二童趨出投水中久之不起衆危之踰半日水忽涌起二童共持一大蛇頭出頭微有角蓋蛟類也二童仆地久而始蘇女是夜始安寢病不復作矣道士由是名譽大振後有人召之竟不驗或疑其犯淫汚自壞也夫蛟惡物也昔周子𨼆許旌陽皆嘗斬蛟疑天地間自有此等神術人能至誠感神則神物為之呵護而其術以行不然則深淵之底蛟龍之所璠據人雖氣正而才武非其素履熟由之地而亡生以狥之鮮有不墮其牙頰者矣安望其能提髑髏而出哉翰林編修張元禎嘗建言選六科給事中不必拘體貌長大惟當以器識逺大學問該博文章優贍者充之其言最當徒以不拘體貌一言有礙竟托之空言而已蓋六科係近侍官兼主奏對必選體貌端厚語言的確者以壯觀班行表儀朝寧但在前居此地者體貌非不端厚而其器識學問文章往往過人蓋出自精選號為得人如姚䕫葉盛林聰尹旻張寧輩是已以後則專以體貌為主而其所重者反不之計所謂出題考選亦不過虛應故事耳揆其所以其時典選者相繼多北人大率專主體貌則其類得以並進况學識兼備者必思舉其職而屢有糾彈不若安靜簡默者之易制也鹽山王忠肅公素有重望亦進一二鄉里之劣者則其餘不足責矣使為吏部者以公天下為心不隂厚鄉里遇缺選其體貌豐偉音吐正當者五倍其數試其奏議彈文數篇若場屋時文則不以試每五六人中擇其優者一人奏上如此而不得人吾未之信也同寮吳味道處之遂昌人嘗言其家人看稻莊所夜吹笛以自娛忽有大靣矬人倚石而聽之次夜亦然家人知其為鬼物然未敢發也至三夜乃然炭坐處置鐵筯炭中取笛吹之其物復來乃出其不意取筯刺之急趨水旁去詰旦蹤跡之見一大蝦蟇死水旁刺㾗在其頷下近時言官言宫闈事嘗受挫辱自是事無大小噤不敢言有孫御醫者素善謔人問生疥何以愈之曰請六科給事中餂之問故曰不語唾可治疥也崑山有徐生善寫竹嘗遊京師吏科有知者請寫竹於壁寫畢欲題其上云朝陽鳴鳯或云恐致人口語不若易以舞鳯或又以為不可乃以彩鳯易之有從旁語云鳴也鳴不成舞也舞不成不如好衣服搖擺過日可也衆哄堂一笑而散聞此等嘲謔固言路之不幸亦非國家之幸也土兵之名在宋嘗有之本朝未有也成化二年延綏守臣言營堡兵少而延安慶陽府州縣邉民多驍勇耐寒習見敵人敢於戰鬭若選作土兵練習調用必能奮力各護其家有不待驅使者兵部奏請敕御史往㑹官㸃選如延安之綏德州葭州府谷神木米脂吳堡清澗安定安塞保安慶陽之寧州環縣選其民丁之壯者編成什伍號為土兵原㸃民壯亦改此名其優恤之法每名量免户租六石常存二丁貼其力役五石以下者存三丁三石以下者存四丁於時得壯丁五千餘名委官訓練聽調此陜西土兵之所由始也成化十六年四月初二日雲南麗江軍民府巨津州雪山移動十七年六月十九日戍時大理府地震有聲民屋搖動二次而止鶴慶軍民府本日亥時滿川地震至天明約有一百餘次次日午時止廨舍墻垣俱倒壓死軍民囚犯皂𨽻二十餘人傷者數多鄉村民屋倒塌一半壓死男婦不知其數麗江軍民府通安州本日戍時地震人皆偃仆墻垣多傾以後晝夜徐動約有八九十次至二十四日卯時方止各處奏報地震無嵗無之而雲南之山移地震蓋所罕聞者故記之菽園雜記卷七
