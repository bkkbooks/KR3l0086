body:
  text: 菽園雜記卷八明陸容撰襲封衍聖公每嵗赴京朝賀沿途水陸驛傳起中馬站船廪給回日無馬快船裝送而張真人往回水陸起上馬站船廪給且有馬快船之從蓋其時方崇道教而內官梁芳左道李資省輩方用事故致隆於其所尊如此豫聞之頗不平言於尚書余公欲優厚之公慨然曰是義舉也即日奏允自是衍聖公往回陸路得起上等馬回日應付馬快船裝送於吾道實有光云時成化十六年三月初五日也近有中官怙寵市恩以結人心騰驤左右等四衛勇士小厮及養馬軍奏乞悉給以胖襖袴鞋事不下議部即可之時固安王公復為工部尚書余肅敏問之曰府庫衣袴之富如此先生何議不及此使恩出斯人乎王公曰祖宗之制邉方有警應調京軍出征則以此給之使其不勞縫製得以尅日起行京衛軍士守衛守城者無調遣之急嵗給與布匹綿花使軍妻各自縫製以省有司勞費此良法美意之所在也今四衛軍士既給以布花而又加此非惟失豫備非常之初意且使恩出內竪其於國體胥失之矣余公服其言每讀春秋左氏𫝊列國大夫或論事或諫君動輒陳古制度如指諸掌公父文伯之母雖一婦人而其叙王后親織𤣥紞以下云云本末不遺如此則當時學士從可知矣於此不惟見古之人才皆有用之學亦可以占先王教化之盛矣今吏部每選考試監生作經義有不能記本題者任意書平日所記文字塞白名曰請客文章亦得除授有司一職云此風自宣德以來已有之矣夫時文與古義雖大不倫而姑恤之政蓋無有甚於此者嗚呼使此輩而寄以民事欲民之弗病得乎嵇昭蘇州崑山人正統六年任知灤州涉獵古今涖民得體尤善楷書十三年以外艱去至今不忘其善此永平府志名宦條所載然崑山未聞有此人豈其先流寓他處出身籍貫猶書所自與記以備考廣陵之墟有五子廟云是五代時羣盜嘗結義兄弟流劫江淮間衣食豐足皆以不及養其父母為憾乃求一貧嫗為母事之甚孝凡所舉動惟命是從因化為善鄉人義之殁後且有靈異因為立廟吳中祭五通神者必有所謂太媽疑即此鬼也噫人莫不善於為盜而亦有風木之思天理之在人心固未嘗泯也况非其真母而皆能循其教卒化為善不亦尤可取乎世有親在而不遵其教親殁富貴而不思者視五子能無愧乎延安綏德之境有黃河一曲俗名河套其地約廣七八百里外夷時竊入其中久之乃去葉文莊公為禮部侍郎時嘗因言者欲築立城堡耕守其地奉命往勘大意謂其地沙深水少難以駐牧春遲霜早不可耕種其議遂寢然聞之昔張仁願築三受降城正在此地前時蠻人巢穴其中春深才去近時關中大饑流民入其中求活者甚衆踰年才復業則是非不可以駐牧耕種也當再詢其所以周禮春祭馬祖夏祭先牧秋祭馬社冬祭馬步其文甚明今北方府州縣官凡有馬政者每嵗祭馬神廟而主祭者皆不知所祭之神嘗在定州適知州送馬神胙因問所祭馬神何稱云稱馬明王之神及師生入揖問之亦然蓋此禮之不講久矣但不知大僕寺致祭如何未及問也天妃之名其來久矣古人帝天而后地以水為妃然則天妃者泛言水神也元海漕時莆田林氏女有靈江海中人稱為天妃此正猶稱岐伯張道陵為天師極其尊崇之辭耳或云水隂類故凡水神皆塑婦人像而擬以名又如湘江以舜妃鼓堆以堯后蓋世俗不知山水之神不可以形像求之而謬為此也翰林院尚寶司六科官其先常朝俱在奉天門上御座左右侍立故云近侍今皆在門下御道左右云是太宗晚年有疾用女官扶持上下因退避居下今遂為定位六科本與尚寶司相鄰今工部委官製衣處猶稱六科廊是也永樂間失火遷出午門外今遂為定居江通理云金陵一民家被雷失去二人遍求之乃對坐一空匱中其髮莖莖相結凌季行言禇御史昌𦙍家人遇雷震死遍身衣皆裂成絶條其條闊狹如一邵文敬言其鄉雷擊一佛殿兩鴟尾皆失去蓋脊筒瓦內石灰泥撤净如掃而瓦復不動張汝弼言松江一塔被雷凡七層每層簷鈴皆失去其舌夏德乾御史知新淦縣言本縣一山有雷神甚靈異嘗祈雨雷雨大作空中有物形聲如鴨嘴爪如鷹者三盤旋而飛廟有大松十數株每株爪去其皮二道自根至梢俱深入寸許無一差爽瞿世用御史嘗知崇仁縣一日雷雨中有物墮譙樓黑色無頭尾其圓徑丈餘不久復飛去疑其為雷神此皆平日聞坐客所談因類記之羣舊作群云髙皇惡君與羊並命移君羊上昶舊作昶云文皇為夏中舍改書崑舊作昆云昆尹馬文炯欲鎮壓其民改書此鄉俗相𫝊然羣崑古字觀韻書可知昶字嘗於山東憲副陳善所觀趙松雪墨卷見之蓋遍旁上下自昔竝用祖宗及文炯或者改其一時所見耳非始此也天順甲申進士􅀢茂英宗不識其姓問之李閣老賢賢對以音與陜同因命改姓陜近時山東布政使胡德盛奏事適北邊有警上覽疏見其名嫌德盛與得勝相近命改名靖天順間江西儒士吳與弼講明理學名重一時嘗被薦徴上京師授春坊諭德力辭不受遣還田里成化間海南貢士陳獻章亦以理學名有司嘗應詔薦上上吏部奏除翰林院檢討駕部貟外郎張弼書韻語誚之云君恩天地寬臣節日月皎無事徒受官優游豈不好未識義如何借問程明道李密是何人亦有陳情表獻章不能答未久辭歸獻章與弼門人也于公謙王公文遇害時以迎立外藩誣之文稱寃謙但云親王非有金符不可召當辨之時印綬尚寶諸內官聞之檢閲各王府符具在獨無襄王府者衆皆危疑不知其故乃問一退任老內官云嘗記宣德間老娘娘有㫖取去但不知何在老宫人某尚在必知其詳遂往問之云是宣廟賔天時老娘娘以為國有長君社稷之福嘗欲召襄王因取入後以三楊學士議不諧而止符今在後宫暖閣中老娘娘張太后也於是啓太后求之果得於其處已積塵埋沒寸餘矣其後英宗悟二人之寃而悔者亦以此云成化十三年福建長樂縣平地長起一山長三日而止度之髙二丈餘橫廣八丈其旁一池忽生大蜆民取食之味甚美乃爭取食食者不數日患痢死者千餘人戴御史用字廷獻江西髙安人未第時嘗延一師於家孰師好為人作訟牒用父却之其俗凡為師棄於人者無所容身由是怨之乃匿處鄰郡令家人訟於官云師有經義直銀若干用圖之致死用不勝搒掠乃自誣服用家出重賞購求能得其蹤跡者踰年忽一人報其匿處乃俾為嚮導果得之事始白後登成化丙戍進士第仕至貴州參議彼衡門褐夫不皆用伍則死於寃獄者豈少乎此典刑者所以不可不敬慎也正統間楊文貞公自江西還朝所過餽送一切不受耿清惠公時為淮揚鹽運使餽雞四翼茄一盤楊公受之且携手而行其激揚之意默寓於交際如此先奉直公時客淮揚親聞其事天順間安陽民牧牛入一破塜中鐵索懸一棺去地四五尺四旁無一物民搖動其棺沙土蒙頭而下不能開眼民懼急趨出沙已沒趺矣翌日拉伴往視之沙土滿中不復見棺蓋觸其機發也山西之石樓永昌陜西之神木等縣土人善邪術名小法子能以刀錐置人腹中痛久之即死始覺時急求解法則免廣東西人善造蠱置飲食中中之即腹脹死以藥物解之即吐出本形或魚或蛇或蝦蟆而愈雲南孟密等夷有術能以木換人手足骨人初不覺久之行逺任重即痛不能勝有不信者死之日剖股視之果木也此皆問之其鄉人皆以為實有者成化初江淮大饑都御史林公聰以便宜之命賑濟駐節揚州令御史借糧十萬石於蘇州府知府林公一鶚以蘇為閩浙襟喉江淮衝要萬一地方不靖無糧其何以守不許御史乃借之松江而去人以一鶚知大體云古對以文字分合者如鉏麑觸槐甘作木邉之鬼豫讓吞炭終為山下之灰陳亞有心終是惡蔡襄無口便成衰二人土上坐一月日邉明半夜生孩子亥二時難定兩家擇配己酉二命相當皆佳近又聞有云人曾作僧人弗可作佛女卑為婢女又可為奴亦可喜史傳所載修已背坼而生禹簡狄胸坼而生契陸終氏娶鬼方之女開其左右脅而生昆吾等六人浮屠氏稱釋迦之生出母右脅黃冠氏稱老𥅆之生出母腋下先儒多以為妄魏黃初五年汝南屈雍妻王氏生子從右胳下水腹上出宋時莆田尉舍之左有市人妻生男從股髀間出皆創合母子無恙二事各有指據然亦未敢盡信也近見巡按鳳陽御史周蕃奏靈壁縣民家生一子潰母臍下而出創潰處尋愈據此則汝南莆田二子之生當亦不誣也漢唐宋兵制皆取兵於民壯則入伍老則放歸即三代寓兵於農之遺制也本朝軍伍皆謫發罪人充之使子孫世世執役謂之長生軍且謫發之地逺者萬里或數千里近者千餘里南北易調非其土性難以自存是以死傷逃竄者十常七八行伍實數能幾何人况有罪謫發者率皆奸民善於作弊無惑乎什伍之虧耗也在京惟府軍前衛幼軍皆止終其身與前代兵制暗合旗手衛有等軍士永樂間奉有不逃止終本身逃者子孫勾補之㫖寧老死行伍無一人逃者府軍前衛幼軍舊亦多逃近比旗手之例著為常令故今亦無逃者蓋逃者特為身謀其不敢逃者為子孫謀也使當時議兵制者以前代之制為主而以此法繩之則𨼆匿脫漏之弊固不能保其必無恐亦不至今日之甚也急須飲器也以其應急而用故名趙襄子殺智伯漆其頭以為飲器注云飲於禁反溺器也今人以暖酒器為急須飲字誤之耳吳音須與蘇同今稱暖熟食具為僕憎言僕者不得侵漁故憎之王宗銓御史嘗見內府揭帖令工部製步甑云即此器乃知僕憎之名傳訛耳直駕校慰著團花紅緑衣戴飾金漆帽名曰只孫鵝帽只孫衣名今人有稱執金吾帽者亦似是而非也醫士劉溥字原博博學能詩畫士范暹字啓東讀書善談二老皆蘇人在宣德正統間館閣諸公皆愛重之原博僅官太醫吏目啓東終身布衣而已意者當時士人皆知自重不肯干人當道亦不肯以名器私其所厚而然邪吾於是不能無感崑山五保張某兄弟業瘍醫凡求療者必之弟而不之兄由是弟日饒兄日凋落兄妬之欲俟其出將甘心焉一日買舟入城兄預匿舟中行至新洋江忽起捽其弟舟人懼急搒舟就岸得逸去將訟縣有父老曰彼無天理而害汝今計不行是有天理也若訟之且將拘繫證佐必貽害舟人不如且止從之未幾兄一夕睡至旦目不能開竟成瞽疾而死於貧人以為不道所致云元制內設中書省外設行中書省故舊時移文中多稱各省今既改行省為布政司而移文奏章尚有稱省者今之提刑按察司即元之肅政廉訪司俗稱按察使為廉使按察司多扁肅政字皆踵其舊也揆之時制似亦非宜在京各道㕔事及在外察院多扁正己字諸司則無之蓋誤讀程伯淳語御吏為御史故也不然豈有官者皆不必正己惟御史當然耶玉篇竒字類如欵乃万俟宿留冒頓可汗閼氏龜兹皆連綿假借餘如袒免星宿之類半是本字未為竒也今記憶類此者書之讀書有得當不一書於戲烏呼委蛇逶迤齊衰咨崔相近禳祈扶服匍匐揚休陽煦子諒慈良惡池呼沱曲逆去過休屠朽除譙訶誰何從㬰總勇陂池坡陀取慮趨廬毒冒代妹未嬉妹喜揖濯楫擢魋結椎髻灑削洗鞘崖皆闕朱提主池潘流清處之青田人與嶽內翰季方同游太學俱有文名且相友善流清未仕卒其子辰幼孤流落京師一日季方過陳緝熙內翰適其友李斯式出揖季方愕視久之問故云此吾故友潘流清應真也翌日遣人延斯式至家命工寫其真且以示辰云此汝父遺容命拜之辰不識持歸示其母其母泣涕而藏焉此亦衣冠中一異事也辰字時用博學能詩文與李賔之學士有通家之好李蓋嶽之壻云松江一京官養痾家居因星士言某年當死不測日以詩酒盤桓園池間雖比鄰招飲亦不出也一日彈琴假山下石仆壓死閩中一娼色且衰求嫁以圖終身人薄之無委禽者乃决之術士云年至六十當享富貴之養娼不以為然後數年閩人子有奄入內廷者既貴聞其母尚存遣人求得之館於外第翌日出拜之遙見其貌陋恥之不拜而去語左右云此非吾母當更求之左右觀望其意至閩求美儀觀者乃得老娼以歸至則相向慟哭日隆奉養閲十數年而沒威寧伯王公為大同總兵時術士俞姓者一日過職方豫問之曰當不久敗矣豫問當在何年曰今年未幾降敕面諭革爵為民安置安陸州周宗伯洪謨之父嘗為長陽訓導作妖魅說言門生何瓚與其弟飲民家瓚醉歸失弟所在搜於山纍日得之木上問其故云一人引至此今見爾輩來遁去矣蓋山鬼也又門生之父鄭老者入深山採藥遇木有大􅌲乃取之行數里有人追與鬭云何以割吾耳當見還鄭老巫者有禳鬼術其人不能加害而去然精思恍惚迷其歸路後數日家人尋得之邀使歸固不肯乃執以歸藥之而醒備言其故如一夢也大抵深山幽谷中固多強死之鬼與木石鳥獸之怪人不知戒故有獨行遇害者凡入深山者須持利創不宜獨行吏部尚書歷城尹公旻罷後朝士多指其招權納賂之跡甚者上章乞籍其家資之半賑濟山東饑民公之富未必如是之甚也其所以失士大夫之心者直以待人不誠耳如各部司屬官之賢能者每向人稱道之以示其知人及推舉時乃先掌科掌道官若舉部屬亦先出入中官之門者平日所稱道者反不與又嘗記戶科給事中李孟暘奉使山西回見代州等處要地武備不飭奏乞設整飭兵備副使以專其責兵部覆奏已得㫖俞允及咨吏部乃寢而不行後察之副使該於刑部年深郎中內以次升用一鄉人覬覦京職不欲外升欲越次他升又恐機泄故止覬覦京職者不久果升大理丞後坐其黨調外任吳中有鬼善淫凡懷春之女多被汚與之善者金帛首飾皆為盜致吾崑真義民家一女將被汚女曰涇西某家女貌美何不往彼而來此鬼云彼女心正女怒曰吾心獨不正耶遂去更不復來乃知邪不干正之說有以也蘇城商人蔡某嘗泊舟京口見一客長軀偉貌鬚髯被腹髭長數寸蔽口竊計其有礙飲食乃邀入食肆以觀之客臨食脫帽拔髻中二簪綰其髭插入兩鬢長啜大嚼旁若無人食已謝去曰感君厚情何以為報令舟中取一木棍授之云倘舟行有人侵侮當以此示之云鬍子老官壓驚棍在此彼必退去後行江中猝遇暴客蔡如其言果不犯而去如是者再始知其為暴客之渠魁威信素行於人故也蔡後死九江客聞之賻以白金遣人護喪至京口而去鈔字韻書平去二聲皆為略取寫録之義無以為楮幣之名者今之鈔即古之布詩云抱布貿絲周禮宅不毛者有里布是也但古以皮故曰皮幣今以楮故曰楮幣耳宋有交子會子關子錢引度牒公據等名皆所以權變錢貨以趨省便然皆不言其制惟入中鹽糧有鹽鈔鈔之名始見宋史蓋即今鹽引也今文移中有關子僧道簪剃有度牒鄉試舉人投禮部有公據茶鹽等貨俱有引皆公文耳金史記交鈔之制外為闌作花紋其衡書貫例外書禁條闌下備書經由行換之法及其印章花押一貫至五十貫名大鈔一伯文至七百文名小鈔以七年為限納舊易新元史記鈔之文云以十計者四曰一十文二十文三十文五十文以百計者三曰一百文二百文五百文以貫計者二曰一貫文二貫文然皆不詳其尺寸之制今之鈔蓋始於金而元承其制本朝沿襲之歟聞洪熙宣德間猶有百文鈔今但有一貫文者每貫直銀三釐錢二文非復國初之直矣其制以桑樹皮為之竪長一官尺橫八寸額上橫作楷書云大明通行寶鈔中作楷書一貫二字字下圖一貫錢形左右作疉各四字云大明寶鈔天下通行其下楷書鈔法禁例上下鈐户部印四圍花紋闌鐲音蜀又音濁周禮鼓人以金鐲節鼓注云鉦也形如小鐘韻書又云溫器今人名臂環為鐲音濁蓋方言也近考之蠋桑蟲一名蚅爾雅蚅烏蠋詩鞗革金厄注云金厄接轡之環形似烏蠋以金為之今女人金銀臂環纍纍有節而拳曲正如蠋形鐲當作蠋音雖少異其義甚明里人曾孟源嘗夜行有水當涉遇一舊識云吾負汝過孟源喜從之及上其身忽悟云此人已死安得在此必鬼欲迷我耳乃堅附其背既登岸負者云可以下矣孟源附之益堅忽變為一版抱至民家叩門乞火燭之乃火焦棺板也劈而焚之深以為不詳自分必死然竟無恙後年逾七十而終菽園雜記卷八
