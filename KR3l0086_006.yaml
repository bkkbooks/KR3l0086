body:
  text: 菽園雜記卷六明陸容撰元起朔漠建都北平漕渠不通江淮至元初糧道自浙西涉江入淮由黃河逆水至中灤旱站陸運至淇門入御河中灤即今開封府封丘縣地淇門今屬大名府濬縣乃淇水入御河之處即枋頭也去中灤旱站一百八十餘里自黃河逆水至中灤自中灤陸運至淇門其難蓋不可言况運粟不多不足以供京邑之用於是遂有海運之舉然海道風濤不測損失頗多故又自任城開河分汶水西北至須城之安民山入清濟故瀆通江淮漕經東阿至利津河入海由海道至直沽接運至京任城今之濟寧州也須城今之東平州也其後海口沙壅又自東河陸運二百餘里至臨清始入御河其難尤不可言時有韓仲暉邊源輩各出己見相繼建言乃自安民山開河直抵臨清屬於御河而江淮之漕始通矣然當時河道初開不甚深濶水亦微細不能負重載所以又有㑹通河止許一百五十料船行之禁海運之初嵗止得米四萬六千餘石其後嵗或至三百餘萬石㑹通河所運之米每嵗不過數十萬石終元之世海運不罷國初定鼎金陵惟遼東邊餉則用海運其時㑹通河尚通今濟寧在城閘北岸見有洪武三年曉喻往來船隻不得擠塞閘口石碣在至二十四年河决原武漫過安上湖而㑹通河遂淤自是江淮舟船始不至御河矣永樂間肇造北京糧道由江入淮由淮入黃河水運至陽武發河南山西二布政司丁夫旱路般運至衛輝上船由御河水運至北京亦不可謂不難矣後得濟寧州同知潘叔正建言工部尚書宋禮等提督始開鑿㑹通河潘之建言止為濟寧州往北旱站遞運軍需等項艱苦欲開此河以省民力耳初未嘗言開此漕運也河成宋尚書建言始從㑹通河漕運而海運於是乎罷當㑹通河漕運之初又得平江伯陳瑄於凡河道事宜莫不整頓所以至今京儲充羡不至缺乏者㑹通河之力開鑿經理以底於成者斯又數君子之力也此出刑部侍郎三原王公恕漕河通志節其要語記之張巡力竭西向再拜曰生既無以報陛下死當為厲鬼以殺賊此厲字與伯有為厲之厲不同原其意誓欲為猛厲之鬼以殺賊耳李翰表云臣聞强死為厲游魂為變有所歸往則不為災此正伯有為厲之厲翰之意蓋欲乞為墓招葬巡等故云然耳非解厲鬼字義也後人多誤解此字致生邪說至有以厲即古癘字謂巡為掌疫癘之鬼若致道觀塑巡為青面鬼狀世之訛謬如此正由誤解此字故也吳中羽林將軍廟訛為雨淋而不覆以屋三孤廟訛為三姑而肖三女郎焉山西有丹朱嶺蓋堯子封域也乃鑿一豬形以丹塗之世俗傳訛可笑大率類此月令言十月雉入大水為蜃人不知其能化蛟也張啓昭翰撰言其鄉民嘗逐一雉入山穴中守之久不出乃以土石塞之而去每過其處竊視之封閉如故人不知也久之見其處有水流出不已踰時又過其處則山已崩裂其下成渠問之居民云風雨之夕有蛟出故也逐雉者為言其事始知雉亦能為蛟云京師多尼寺惟英國公宅東一區乃其家退閒姬妾出家處門禁嚴慎人不敢入餘皆不然然有忌人知者有不忌者不忌者君子慎嫌疑固不入忌者有竒禍决不可入天順間常熟一㑹試舉人出游七日不返莫知所之乃入一尼寺被留每旦尼即鐍户而出至暮濳携酒殽歸故人無知者一日生自懼乃踰垣而出出則臞然一軀矣又聞永樂間有圬工修尼寺得纏騣凶鬯匕帽於承塵上帽有水晶纓珠工取珠賣於市主家識而執之問其所從來工以實對始知此少年竊入尼室遂死於欲尸不可出乃肢解之埋墻下法司奏抵尼極刑而毁其寺今宫墻東北草場云是其廢址也唐季黃巢之亂兵鋒所過多被殺傷然巢性獨厚於同姓如黃姓之家及黃州黃岡黃梅等處皆以黃字得免徽州歙縣地名篁墩本以産竹得名民以黃易之亦得免禍近日程克勤諭德始徴士大夫詩文表白其事而復篁墩之名夫大盜如黃巢亦有此善則信乎天理民彛之在人心未嘗一日而泯滅也永樂間敕遣大臣分行各處凡民間子弟年二十以上爽健者皆選取以備侍衛頗被騷擾其軍悉隸府軍前衛數至二萬有餘立千户所二十五領之年至六十驗有老疾實狀兵部奏請踈放仍於本州縣照名選補成化間尚書余公議欲再為差官㸃選時當選處適多饑饉職方郎中劉大夏與豫力沮之余不能奪其議遂寢今之所謂左蓋即古人之所謂右如易繫辭傳書其後曰右第幾章說文注親字云左從辛從木志錢幣者云五銖錢右文曰貨泉左文曰五銖是矣今人乃與相反豫求其說而不可得竊疑古人北面視物分左右物在東者值吾右手故為右物在西者值吾左手故為左今人以南面視物分左右故反是然古人言宫室位置則云前朝後市左祖右社軍行部位則云前朱雀後𤣥武左青龍右白虎則祖廟與青龍在東太社與白虎在西又與今人所謂左右不異未能决然無惑也成化辛丑嵗西域賽瑪爾堪進二獅子至嘉峪關奏乞遣大臣迎接沿途撥軍護送事下兵部豫謂進貢禮部事兵部不過行文撥軍護送而已時河間陳公鉞為尚書必欲為覆奏豫草奏大略言獅子固是竒獸然在郊廟不可以為犧牲在乘輿不可以備驂服蓋無用之物不宜受且引珍禽竒獸不育中國不貴異物賤用物等語為律力言當卻之如或閔其重譯而來嘉其奉藩之謹則當聽其自至斯盡進貢之禮若遣大臣迎接是求之也古者天王求車求金於諸侯春秋譏之况以中國萬乘之尊而求異物於外夷寧不詒笑於天下後世陳公覽之恐拂上意乃咨禮部時則四川周公為尚書亦言不當遣官迎接事遂寢而遣中官迎至其狀只如黃狗但頭大尾長頭尾各有髵耳初無大異輟耕録所言皆妄也每一獅日食活羊一腔醋蜜酪各一瓶養獅子人俱授以官光祿日給酒飯所費無算在廷無一人悟獅子在山藪時何人調蜜醋酪以飼之蓋外人故為此以愚弄中國耳莊子言即且甘帶即且蜈蚣帶蛇也初不知甘之之義後聞崑山士子讀書景德寺中嘗見一蛇出游忽有蜈蚣躍至蛇尾循脊而前至其首蛇遂伸直不動蜈蚣以左右鬚入蛇兩鼻孔久之而出蜈蚣既去蛇已死矣始知所謂甘者甘其腦也聞蜈蚣遇蝸即不能行蓋物各有所制如海東青鷙禽也而獨畏燕象猛獸也而獨畏鼠其理亦然讀書萬卷不讀律致君堯舜終無術此雖譏切時事之言然律令一代典法學者知此未能律人亦可律已不可不讀也書言議事以制而必曰典常作師其不可偏廢明矣嘗見文人中有等迂腐及浮薄者往往指斥持法勤事之士以為俗流而於時制漫不之省及其臨事誤犯吏議則無可釋而溺於親愛者顧以法司為刻良可笑也本朝子為母服斬衰三年嫂叔之服小功皆所謂緣人情而為之者也然韓退之幼育於嫂嘗為制服而程子於嫂叔無服亦嘗言後聖有作雖制服可也母服斬衰則以儒臣羣議不合高皇斷自宸衷曰禮樂自天子出此禮當自我始北方老嫗八九十嵗以上齒落更生者能於暮夜出外食人嬰兒名秋姑豫自幼聞之不信同寮鄒繼芳郎中云歷城民張家一嫗嘗如此其家鎖閉室中鄒非妄誕人也秋北人讀如篘酒之篘一彎西子臂七竅比干心詠藕詩也相傳衛文節公作未知是否一庭生意留青草萬里歸心放白鷼恕齊詩也程少詹克勤云嘗見作此題者多涉頭巾氣惟此聯出色又聞邵復初郎中云鄉人取龍湫祈雨後送水還湫有作文者集古句一聯云雨三日不止求之與與之與水一勺之多出乎爾返乎爾亦佳永樂三年命翰林學士解縉等選新進士才質英敏者就文淵閣讀書時與選者修撰曽棨編修周述周孟簡庶吉士楊相劉子欽彭汝器王英王直余鼎章敞王訓柴廣敬王道熊直陳敬宗沈升洪順章朴余學䕫羅汝敬盧翰湯流李時勉假民倪維哲𡊮添祥吾紳楊勉二十八人時周忱自陳年少願進學文皇喜曰有志之士命增為二十九人名庶吉士聞洪武壬子嵗嘗選㑹試士十八人授編修等職讀書文華堂後又選進士為庶吉士分置近侍諸署若解縉為中書庶吉士是也而專置之翰林則始於此天順間文臣閣老李文達公賢武臣錦衣衛指揮門達最得君而達尤聲勢隆赫傾動中外嘗忌李出已上欲乘隙間之有軍匠楊暄者以工彩漆著名于時一日疏達不法事以聞達因訴於上云此李賢嗾之也知上必親鞫密召暄囑之暄懼死陽承順惟謹上果鞫於內苑山子下暄以實對云事非由賢門達囑臣誣賢臣與賢素不識不敢枉也達由是寵衰而禍作矣古人謂無好人三字非有德者之言觀此可知今人有喪剪帛以授弔客謂之發孝大扺京師人家發孝主於勾引祭賻之資江南人家發孝主於勾引人光賁送喪士大夫家亦有為之者此非禮之禮也楊文貞公遺戒子孫不用此最是朱文公先生本號晦菴今人稱考亭者亭本前代一御史築於其考墓旁故名歲久亭廢韋齊愛其山水嘗欲即其廢址作書院而不果文公後作考亭書院以成先志非别號也行人司行人初置三百六十員今存三十六員蓋國初諸司官不差出凡有事率差行人永樂中减革行人員數諸司公務差本衙門官出辦行人非册封親王使外國賫捧詔書之類不差然當時進士除行人者九年才得升六品官人多不樂今九年得升各部貟外郎三年得選任御史行人頓為增重於前舊嘗為之語云非進士不除非王命不差非餽贐不去其濫可知今朝廷重之人各自重無此風矣秋官屠郎中之妻無子而妒懼其夫置妾常為贋娠以沮之一年果娠彌月而産則一胞為鳥卵者四十七破之中有血水而已項尚書之女無夫而娠家人恐其彰醜飲以冷藥敗其胎竟不效及期而産一胞數蛇遂驚死皆不知其何所感也孫狀元賢赴㑹試途中投宿一民家主人敬禮甚隆飲食一呼而具賢疑其家有他㑹問之主人云昨夜夢狀元至故治具以俟今日公至應此夢無疑矣賢竊自喜至期下第而歸後一科果狀元及第雍御史泰未第時嘗自金陵還陜西道經鳯陽投宿一老嫗家問知是舉子喜云昨夜夢有御史過吾家子其人耶雍後以進士令吳被召為御史陸參政孟昭未第時夫人夢得官參政後果不爽觀此則人之出處信有前定非偶然也錢原溥學士回自謫所道江西布政使翁公世資作詩送之序云天順間先生嘗謂兵部尚書陳汝言曰方今論功行賞殆無虛日而母后徽號未加得非闕典與汝言即以先生之言入奏英宗大加稱賞隨付史氏以行嵗甲申英廟上賔先生遂為權貴所擠而有順德之行皇上一日御經筵閲講臣獨以先生不在為問遂下吏部召還復舊官豫嘗以是質之內閣供奉謝伯寬云嵗甲申以下一假失實蓋原溥嘗在內書堂教書今之近侍若懷恩輩皆多出其講下其出以附王倫其入以懷公之力也本朝文臣封伯爵者洪武中中書左丞相汪廣洋封忠勤伯𢎞文館學士劉基封誠意伯正統中兵部尚書王驥封靖逺伯天順中都察院副都御史徐有貞封武功伯鴻臚寺卿楊善封興濟伯成化間兵部尚書兼都察院左都御史王越封威寧伯廣洋後坐纍有貞越不久革爵謫逺地基善革於身後子孫世祿驥一人而已本朝軍衛舊無學今天下衛所凡與府州縣同治一城者官軍子弟皆附其學食廪嵗貢與民生同軍衛獨治一城無學可附者皆立衛學宣德十年從兵部尚書徐琦之請也其制學官教授一員訓導二員武官子弟曰武生軍中俊秀曰軍生衛學之有嵗貢始於成化二年五月從少保李公賢之請也其制每二嵗貢一人平時不給廪食至期以先入學者從提學御史試而充之為人上者言動不可不謹否則下人承訛踵誤不勝其弊矣丁酉嵗豫有考技之役至遷安適同年劉御史廷圭按其地遣人招飲豫戲語云饌有驢板腸即赴蓋京師朋輩相戲各有指斥風土所諱以為詬者如蘇浙云鹽豆江西云臘雞湖廣云乾魚之類是已河南人諱偷驢廷圭河南衛輝人而舊傳有西風一陳板腸香之句故以戲之日暮歸縣官率吏人捧熟饌以進問之云聞公嗜驢板腸故以奉也豫以實告而遣之既而自悔自是不敢戲言嘗登嶧山山僧作水飯為供食一𬞞味佳問之云張留兒菜令採觀之乃啇陸也餘姚人每言其鄉水族有彈塗味甚美詳問其狀乃吾鄉所謂望潮郎耳此物吾鄉極貧者亦不食彼以為珍味啇陸在吾鄉牛羊亦不食彼以為旨蓄正猶河豚在吳中為珍異直沽漁人刳其肝而棄之時魚尤吳人所珍而江西人以為瘟魚不食世之遇不遇豈惟人為然夫物則亦有然者矣仲裘聞張留乃樟栁也兵部侍郎王偉先任職方郎中用少保于公薦升是職未幾伺于公過誤密奏之景皇帝信任于公方專召入以偉奏授之公叩頭謝罪上曰吾自知卿卿勿憾也公既出偉下堂迎問曰今日聖諭為何公曰姑入語之既入復請乃笑曰老夫有不是處賢弟當面言之未敢不從也何忍至此乃出奏示之偉局蹐無地君臣相與如此誰得而間之此于公所以得成安社稷之功也常朝諸司奏事御前事當准行者上以是字答之成化十六七年間上病舌澀每答是字苦之鴻臚卿施純彥厚揣知之隂獻計於近侍云是字不便請以照例字易之上得此甚喜問計所出近侍以純對由是得拜禮部侍郎掌寺事尋升尚書加太子少保純京師人成化丙戍進士長軀偉幹音吐洪亮初任户科給事中遷鴻臚少卿未二十年驟升至此可謂際遇之隆矣人有為之語云兩字得尚書何用萬言書天順間鄉人陳錡鼎夫為職方郎中嘗談及時事云近得葉與中奏保巡按廣西御史吳禎巡撫其地時葉公總督廣東西軍務舉禎欲分任其責也因問禎之為人鼎夫云一利口耳與中以誠待物宜有此舉異日必為此人纍也豫竊記之後禎得位結搆廣人百計謗葉李閣老惑之時因言官嘗薦葉入朝僅移節宣府而禎不久亦敗矣豫於是服鼎夫之先見云近聞于少保薦王偉為侍郎時商狀元嘗密言其非所宜薦然疏已入矣既而于公有不愜意時每自嘆云先見不如商大朴大朴商公舊字也凡人黨護族類固其習性同然而回回尤甚嘗聞景泰間京師隆福寺落成縱民入觀寺僧方集殿上一回回忽持斧上殿殺僧二人傷者二三人即時執送法司鞫問云見寺中新作輪藏其下推轉者皆刻我教門人像憫其經年推運辛苦是以讐而殺之無别故也奏上命斬于市豫謂斯人之冒犯刑辟固出至愚然其義氣所發雖死不顧中國之人一遇利害至有擠其同類以自全者較之斯人之激於義而蔽於愚其可哀憐也哉浯溪峿臺唐亭皆在今永州祁陽縣治南五里唐元結次山愛其勝異遂家其處命名制字皆始于結字從水從山從唐皆曰吾者旌吾獨有也今按峿唐字韻書無之蓋制自次山浯本琅琊水名古有此字湘江之溪命名曰浯則自次山耳陳祭酒詢字汝同松江人善飲酒酒酣耳熱胸中有不平事每對客發之人有過面語之不少貸也在翰林時嘗忤權貴出為安陸知州同寮餞之或倡為酒令各用二字分合以韻相協以詩書一句終之陳學士循云轟字三箇車余斗字成斜車車車逺上寒山石徑斜高學士穀云品字三箇口水酉字成酒口口口勸君更盡一杯酒陳云矗字三箇直黑出字成黜直直直焉往而不三黜嘗聞河內縣丞韓肇云一人病耳癢命鑷工爬剔之耳中出彩帛碎屑終亦無恙豫不之信也近尚書淶水張公患瘡在告豫往問候云一日閒坐忽臀肉作癢搔之覺有物在指下摘之抽出肉紅一線五六寸初疑是斤詳視之實線也方怪之俄而覺痛瘡遂作矣即此推之則耳中碎帛亦或不誣此皆理之不可曉者永樂五年㑹議北京合用糧餉雖本處嵗有徵稅及屯田子粒并黃河一路漕運然未能周急必藉海運然後足用見在海船數少每嵗裝運不過五六十萬石且未設衙門專領事不歸一莫若於蘇州之太倉專設海道都漕運使司設左右運使各一員從二品同知二員從三品副使四員從四品經歷司照磨所品級官吏俱照布政司例本司堂上官于文武中擇公勤廉幹者以充其職行移與布政司同各處衛所見有海船并出海官軍俱屬提調以時㸃檢如法整治奏上太宗有再議之㫖遂不行菘菜北方種之初年半為蕪菁二年菘種都絶蕪菁南方種之亦然蓋菘之不生北土猶橘之變于淮北也此說見蘇州志按菘菜即白菜今京師每秋末比屋醃藏以禦冬其名箭幹者不亞蘇州所産聞之老者云永樂間南方花木𬞞菜種之皆不發生發生者亦不盛近來南方蔬菜無一不有非復昔時矣橘不踰淮貉不踰汶雊鵒不踰濟此成說也今吳菘之盛生于燕不復變而為蕪菁豈在昔未得種藝之法而今得之邪抑亦氣運之變物類隨之而美邪將非橘柚之可比邪東里楊先生嘗見崑山屈昉送行詩有佳句默識其名一日知崑山縣羅永年以事上京投謁東里問崑山有屈昉何如人永年茫然無以對東里云士人尚不知邪永年慚赧而退及還任乃求昉識之未幾有詔舉經明行修之士永年乃以昉應詔除南海縣丞卒官前輩留心人物如此開元錢文或讀作開通元寶或作開元通寶本唐髙祖武德四年所鑄非明皇開元間鑄也今錢背間有新月痕人遂以為始鑄錢時工人呈蠟樣楊貴妃玩視之因有指甲痕此蓋不知典故者因明皇年號與錢文偶同而附㑹其說耳伸按錢志謂為文德皇后掐痕菽園雜記卷六
