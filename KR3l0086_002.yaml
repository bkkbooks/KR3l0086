body:
  text: 菽園雜記卷二明陸容撰天順初有歐御史者考選學校士去留多不公富室子弟懼黜者或以賄免吾崑鄭進士文康篤論士也嘗送一𬒳黜生詩篇末云王嬙本是傾城色愛惜黃金自誤身事可知矣時有𬒳黜者相率鳴訴於巡撫曹州李公秉公不為理未幾李得代順德崔公恭繼之諸生復往訴公一一親試之取其可者檄送入學不數年去而成名者甚衆皆崔公之力也二公一以鎮靜為務一以伸理為心似皆有見若其孰為得失必有能辨之者天順三年南直𨽻清理軍伍御史郭觀持法頗刻崑山縣有一人誣首者至連坐二十四人充軍豫家時為里正亦在遣中將欲伸寃於巡撫公聞太倉查用純間習吏學與謀之查云巡撫與御史各領勑書行事訴之無益又謀之崑城高以平氏高云訴之可也或以查語質之高云此非有識之言也在京刑部都察院獄情必大理寺評允無礙才敢决斷御史在外行事旁若無人刑獄茍有寃抑伸理平反非巡撫而誰訴之有益於是往訴都憲崔公果為平反之二十四人皆復為民諺云事要好問三老信然天順癸未㑹試寓京邸嘗戲為魁星圖題其上云天門之下有鬼踢斗癸未之魁筆錠入手貼於座壁亡何失去時陸鼎儀寓友人溫秉中家出以為玩豫為之惘然問所從來云昨日倚門一兒持此示我以果易之豫默以為吾二人得失之兆矣未幾鼎儀中第一名豫下第本朝開科取士京畿與各布政司鄉試在子卯午酉年秋八月禮部㑹試在辰丑未戍年春二月蓋定規也洪武癸未太宗渡江天順癸未貢院火皆以其年八月㑹試明年三月殿試於是二次有甲申科貢院火時舉人死者九十餘人好事者為詩云回祿如何也忌才春風散作禮闈災碧桃難向天邉種丹桂翻從火裏開豪氣滿場爭吐㷔壯心一夜盡成灰曲江勝事今何在白骨稜稜漫作堆至今誦之令人傷感或云蘇州奚昌元啓作正統間工部侍郎王某出入太監王振之門某貌美而無鬚善伺候振顔色振甚眷之一日問某曰王侍郎爾何無鬚某對云公無鬚兒子豈敢有鬚人𫝊以為笑新舉人朝見著青衫不著襴衫者聞始於宣宗有命欲其異於嵗貢生耳及其下第送國子監仍著襴衫蓋國學自有成規也夲朝政體度越前代者甚多其大者數事如前代公主寡再為擇壻今無之前代中官𬒳寵與朝臣竝任有以功封公侯者今中官有寵者賜𫀆帶有軍功者增其祿食而已前代京尹刺史皆有生殺之權今雖王公不敢擅殺人前代重臣得自辟任下寮今大臣有專擅選官之律前代文廟聖賢皆用塑像本朝初建國學革去塑像皆用木主前代嶽鎮海瀆皆有崇名美號今止以山水夲名稱其神郡縣城隍及歷代忠臣烈士後世溢美之稱俱令革去前代文武官皆得用官妓今挾妓宿娼有禁甚至罷職不叙陳元孚先生讀書法生則慢讀吟語句熟則疾讀貪遍數攀聫以續其斷喝怒以正其誤未熟切忌背誦既倦不如少住如此力少功多乃是讀書要務薛主事機河東人言其鄉人有患耳鳴者時或作癢以物探之出蟲蛻輕白如鵝翎管中膜一日與其侣竝耕忽雷雨交作語其侣曰今日耳鳴特甚何也言未既震雷一聲二人皆踣於地其一復蘇其一腦裂而死即耳鳴者乃知龍蟄其耳至是化去也戴主事春松江人言其鄉有衛生者手大指甲中見一紅斤時或曲直或蜿蜿而動或恐之曰此必承兩濯手龍集指甲也衛因號其指曰赤龍甲一日與客泛湖酒半雷電繞船水波震蕩衛戲語坐客曰吾家赤龍得無欲去邪乃出手船忩外龍果裂指而去此正與青州婦人青斤癢則龍出事相類𫝊云神龍或飛或潜能大能小其變化不測信矣哉舊習舉業時嘗作詩說質疑一册近已焚去存其有關大義者一二云羔裘三章朱氏云舍命不渝則必不徼幸以茍得而於守身之道得矣邦之司直則必不阿諛以求容而於事君之道得矣既能順命以持身又能忠直以事上此其所以為邦之美士也如此說未為不可但詳味語意重在首章邦之司直邦之彥兮者贊美之辭耳彤弓三章輔氏云大抵此詩云云疑此說非是蓋載與櫜是藏之之事喜與好是貺之之心右與酬是饗之之節耳當重在首章六月有嚴有翼謝氏云為將必嚴云云軍事不整疑此說非是嚴敬二字相因豈可分屬將帥甫田二章朱氏曰齊明犧羊禮之盛也云云祈年之祭言之疑此說非是此章上下五句各以韻相叶而互見其義耳非必報成之祭無樂以逹和祈年之祭無禮以備物也思文無此疆爾界朱氏疏義以此句專指來牟言疑非作詩者夲意此句文意正如魯頌之無小無大書之無偏無黨皆是形容下文耳臣工王釐爾成來咨來茹先儒說此二句太支離愈致窒礙惟劉須溪未有所言一句得之𤣥鳥三頌多宗廟樂歌與風雅不同故其分節以音韻而不以義理如天命𤣥鳥至正域彼四方以商茫湯方韻為一節若義理則在方命厥后奄有九有處斷分屬商之先后一假者以音韻之協也商之先后受命不殆正應上文天命帝命今讀詩者多不解此移文中字有日用而不知所自及因襲誤用而未能正者姑舉一二如查字音義與槎同水中浮木也今云查理查勘有稽考之義弔本傷也愍也今云弔卷弔問有索取之義票與慓同夲訓急疾今以為票帖綽夲訓寬緩今以為巡綽盔夲盂也今以名鐵胄鐲夲鉦也今以名釧屬又如閘朝閘班課程其義皆未曉其亦始於方言與價直為價值足彀為足勾斡運為穵運此類尤多甚者施之章奏刻之榜文此則承訛踵謬而未能正者也佛夲音弼詩云佛時仔肩又音拂禮記云獻鳥者佛其首注云佛不順也謂以翼戾之禪本音擅孟子云唐虞禪是已自方言各不同佛始作符勿切禪始音蟬今人反以輔佛之佛禪受之禪為借用圈科非知書學者僧慧暕涉獵儒書而有戒行永樂中嘗預修大典歸老太倉興福寺豫弱冠猶及見之時年八十餘矣嘗語坐客云此等秀才皆是討債者客問其故曰洪武間秀才做官喫多少辛苦受多少驚怕與朝廷出多少心力到頭來小有過犯輕則充軍重則刑戮善終者十二三耳其時士大夫無負國家國家負天下士大夫多矣這便是還債的近來聖恩寬大法網踈闊秀才做官飲食衣服輿馬宫室子女妻妾多少好受用幹得幾許好事來到頭全無一些罪過今日國家無負士大夫天下士大夫負國家多矣這便是討債者還債討債之說固是佛家緒餘然謂今日士大夫有負朝廷則確論也省之不能無愧回回教門異於中國者不供佛不祭神不拜尸所尊敬者惟一天字天之外最敬孔聖人故其言云僧言佛子在西空道說蓬萊住海東惟有孔門真實事眼前無日不春風見中國人修齊設醮笑之初生小兒先以熟羊脂納其口中使不能吐咽待消盡而後乳之則其子有力且無病其俗善保養者無他法惟護外腎使不著寒見南人著夏布袴者甚以為非恐凉傷外腎也云夜卧當以手握之令暖謂此乃生人性命之本根不可不保護此說最有理太倉未有學校之前海寧寺僧善定能講四書里之子弟多從之游嘗與人曰為人不可壞了大題目如為子須孝為臣須忠之類是也淮雲寺僧惟寅亦能講解儒書嘗語人曰凡人學藝須學有跡者無跡者不能傳後如琴奕皆為無跡書畫詩文有跡可傳也此亦有見之言其徒嘗誦之有詰之者曰為人而去其天倫謂之不壞大題目可乎為學出日用彛倫之外而歸於寂滅謂之有跡可乎其徒不能答古諸器物異名屭贔其形似龜性好負重故用載石碑螭吻其形似獸性好望故立屋角上徒牢其形似龍而小性吼呌有神力故懸於鐘上憲章其形似獸有威性好囚故立於獄門上叨餮性好水故立橋頭蟋蜴形似獸鬼頭性好腥故用於刀柄上䘎􅀈其形似龍性好風雨故用於殿脊上螭虎其形似龍性好文彩故立於碑文上金猊其形似獅性好火烟故立於香爐蓋上椒圖其形似螺螄性好閉口故立於門上今呼鼓丁非也虭蛥其形似龍而小性好立險故立於護朽上鰲魚其形似龍好吞火故立於屋脊上獸􅀈其形似獅子性好食隂邪故立門環上金吾其形似美人首魚尾有兩翼其性通靈不睡故用巡警出山海經博物志右嘗過倪村民家見其雜録中有此因録之以備參考如詞曲有門迎四馬車户列八椒圖之句八椒圖人皆不能曉今觀椒圖之名義亦有出也然考山海經博物志皆無之山海經原缺第十四十五卷聞博物志自有全本與今書坊本不同豈記此者嘗得見其全書歟關雲長封漢夀亭侯漢夀本亭名今人以漢為國號止稱夀亭侯誤矣漢法十里一亭十亭一鄉萬户以上或不滿萬户為縣凡封侯視功大小初亭侯次鄉縣都侯雲長漢夀亭侯蓋初封也今印譜有夀亭侯印蓋亦不知此而僞為之耳談星命者以十二宫值十一曜立說論人行年休咎十一曜宋潜溪嘗辨之而十二宫亦有可以破愚昧者三代之時人授五畝之宅百畞之田非若後世富連阡陌貧無立錐其時田宅未聞餘缺也男則稼穡女則桑麻以衣以食用器不足以其所有易其所無務本者不至乎貧逐未者不至乎富其時財帛蓋無不足者子事其父弟事其兄少事其長奴僕惟官府有之民庶之家非敢畜也天子諸侯公卿大夫士庶人后夫人妃嬪妻妾各有定制男子二十而冠三十而有室女子十五而笄二十而嫁各有其節婚姻之早晚妻妾之多寡無容異也鄉田同井死徙無出鄉其時遷移之議何自而興四十始仕五十命為大夫七十致仕出身遲速官職崇卑之說何自而起蓋後世上無道揆下無法守於是小道邪說以作雖有聰明才智之士不能不為之惑何則教化不足以深入人心故人自信不篤而狥物易移也京畿民家羡慕內官富貴私自奄割幼男以求收用亦有無籍子弟已婚而自奄者禮部每為奏請大率御批之出皆免死編配口外衛所名净軍遇赦則所司按故事奏送南苑種菜遇缺選入應役亦有聰敏解事躋至顯要者然此輩惟軍前奄入內府者得選送書堂讀書後多得在近侍人品頗重自净者其同類亦薄之識者以為朝廷法禁太寬故其傷殘肢體習以成風如此欲潜消此風莫若於遇赦之日不必發遣種菜悉奏髠為僧私蓄髮者終身禁錮之則此風自息矣吳中民家計一嵗食米若干石至冬月舂白以蓄之名冬舂米嘗疑開春農務將興不暇為此及冬預為之聞之老農云不特為此春氣動則米芽浮起米粒亦不堅此時舂者多碎而為粞折耗頗多冬月米堅折耗少故及冬舂之韓文公送浮屠文暢師序理到之言也髠緇氏乃以不識浮屠字議譏之此可見文公高處蓋是平生不看佛書然耳若稱沙門比丘之類則墮其窠臼中矣後人注身毒國云即今浮屠胡是也又如世俗信浮屠誑誘伊川先生治喪不用浮屠之類皆襲之而作古者韓公也禮不下庶人非謂庶人不當行勢有所不可也且如娶婦三月然後廟見及見舅姑此禮必是諸侯大夫家才可行若民庶之家大率為養而娶况室廬不廣家人父子朝暮近在目前安能待三月哉又如內外不共井不共湢浴不共湢浴猶為可行若鑿井一事在北方最為不易今山東北畿大家亦不能家自鑿井民家甚至令婦女沿河擔水山西少河渠有力之家以小車載井綆出數里汲井無力者以器積雨雪水為食耳亦何常得􅑿餘水以浴此類推之意者古人大抵言其禮當如此未必一一能行之也京師有李實名牛心紅核必中斷云是王戎鑽核遺跡湖湘間有湘妃竹斑痕㸃㸃云是舜妃灑淚致然吳中有白牡丹每瓣有紅色一㸃云是楊妃粧時指捻痕有舜哥麥其穟無芒熟時遙望之焦黑若火燎然云是舜後母炒熟麥令其播種天佑之而生故名有王莽竹每竿著土一節必有剖裂痕云是莽將篡位藏銅人於竹中以應符䜟而然凡此固皆附㑹之事然其種異常亦造化之妙莫能測也杜子飲中八仙歌云李白一斗詩百篇長安市上酒家眠天子呼來不上船說者以船為襟紐竊意明皇或在船召白白醉而不能上耳不必鑿說也唐人韋處士郊居詩云門外晚晴秋色老萬條寒玉一溪烟萬條寒玉謂竹也近時作草書者皆書作蕭條寒玉誤也張繼楓橋夜泊詩二句云江村漁父對愁眠然不若舊本江楓漁火為佳此皆刻本之誤也原本江楓漁火為佳之下曰但不知繼自改定定於他人爾崑山吕寅叔家貧授徒為養平居無故不出門户每嵗春秋祀先師必半夜預詣學隨班行禮禮畢輒去不令縣官知豫在崑學數年見其始終如此雖隂雨不爽也可謂篤厚君子矣陶浩字巨源太倉名醫讀書有識景泰間崑學教諭嚴先生敏妻病豫時為學生遣迎巨源治之嚴杭人適其鄉人尚書于公加少保官其子為千户嚴極口譽之巨源從容曰雖曰不要君吾不信也嚴為默然巨源之識可想矣常朝官懸帶牙牌專主關防出入與古所佩魚袋之制不同觀其正面刻各衙門官名背面刻出京不用字及禁令可知天順三年浙江鄉試䇿問及之而終無决斷蓋見之不明也凡在內府出入者貴賤皆懸牌以别嫌疑如內使火者烏木牌校尉力士勇士小厮銅牌匠人木牌內官及詣司常朝官牙牌若以為滎美之飾則朝廷待兩京為一體何在京伶官之卑亦有之而南京諸司尊官不以此榮美之邪况古者金魚之佩未必出京不用也沈質文卿居太倉家甚貧以受徒為生一夕寒不成寐穿窬者穿其壁文卿知之口占云風寒月黑夜迢迢辜負勞心此一遭只有破書三四束也堪將去教兒曹穿壁者一笑而去視世上如今半似君之句頗為優柔矣張倬山隂人景泰初為崑山學訓年未三十以聰敏聞典史姜某體肥嘗戲張云二十三嵗小先生倬應云四五百斤肥典史有璵僧㑹者嘗對客云儒教雖正不如佛學之博如僧人多能讀儒書儒人不能通釋典是也本朝能通釋典者宋景濓一人而已倬云譬如飲食人可食者狗亦能食之狗可食者人决不食之矣此雖一時戲言亦自可取東西長安門通五府各部處總門京師市井人謂之孔聖門其有識者則曰拱辰門然亦非也本名公生門豫官南京時於一鋪額見之近語兵部同寮以為無意義多譁之問之工部官以豫為然衆乃服吏人稱外郎者古有中郎外郎皆臺省官故僣擬以尊之醫人稱郎中鑷工稱待詔磨工稱博士師巫稱太保茶酒稱院使皆然此前朝俗語相沿之舊習也國初有禁鎖鑰云者以其形如籥耳今鎖有圎身者古制也方身鎖近世所為唐人云銀鑰卻收金鎖合誤以開鎖具為鑰開鎖具自名鑰匙亦云鎖匙菽園雜記卷二
