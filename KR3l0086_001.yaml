body:
  text: 菽園雜記卷一明陸容撰朝廷每端午節賜朝官喫糕糭於午門外酒數行而出文職大臣仍從駕幸後苑觀武臣射栁事畢皆出上迎母后幸內沼看划龍船炮聲不絶蓋宣德以來故事也丙戌嵗炮聲無聞人疑之後聞供奉者云是日內官奏放炮上止之云酸子聞之便有許多議論也上之顧恤人言如此可以仰見聖德矣奉天門常朝御座後內官持一小扇金黃絹以裹之嘗聞一老將軍云非扇也其名卓影辟邪永樂間外國所進但聞其名不知為何物也嘗聞尚衣縫人云上近體衣俱松江三梭布所製本朝家法如此太廟紅紵絲拜裀立腳處乃紅布其品節又如此今富貴家挑逹子弟乃有以紵絲綾段為袴者暴殄過分甚矣近見洪武四年御試録總提調中書省官二人讀卷官祭酒博士給事中修撰各一人監試官御史二人掌卷受卷彌封官各主事一人對讀官司丞編修二人搜檢懷挾監門巡綽所鎮撫各一人禮部提調官尚書二人次御試䇿題又次恩榮次第云洪武四年二月十九日廷試二十日午門外唱名張挂黃榜奉天殿欽聽宣諭同日除受職名于奉天門謝恩二十二日錫宴于中書省二十三日國子學謁先聖行釋菜禮第一甲三名賜進士及第第一名授員外郎第二名第三名授主事第二甲一十七名賜進士出身俱授主事第三甲一百名賜同進士出身俱授縣丞姓名下籍狀與今式同國初制度簡略如此今進士登科録首録禮部官奏殿試日期合請讀卷及執事官員數進士出身等第聖旨俞允謂之玉音次録讀卷提調監試受卷彌封掌卷巡綽印卷供給各官職名又次録三月一日諸貢士赴內府殿試上御奉天殿親試䇿問三日早文武百官朝服錦衣衛設鹵簿于丹陛丹墀內上御奉天殿鴻臚寺官傳制唱名禮部官捧黃榜鼓樂導出長安左門外張挂畢順天府官用傘蓋儀從送狀元歸第四日賜宴于禮部宴畢赴鴻臚寺習儀五日賜狀元朝服冠帶及進士寶鈔六日狀元率諸進士上表謝恩七日狀元諸進士詣先師孔子廟行釋菜禮禮部奏請命工部於國子監立石題名朝廷或有事則殿試移它日謂之恩榮次第又次録進士甲第第一甲三人賜進士及第第二甲若干人賜進士出身第三甲若干人賜同進士出身每人名下各具家狀最後録第一甲三人所對䇿其家狀式姓名下云貫某府某州某縣某籍某生治某經字某行幾年幾嵗某月某日生曾祖某祖某父某母某氏祖父母父母俱存曰重慶下父母俱存曰具慶下父存母故曰嚴侍下父故母存曰慈侍下父母俱故永感下兄某弟某娶某氏某處鄉試第幾名會試第幾名豫奉命犒師寧夏內府乙字庫關領軍士冬衣見內官手持數珠一串色類象骨而紅潤過之問其所製云太宗皇帝白溝河大戰陳亡軍士積骸遍野上念之命收其頭骨規成數珠分賜內官念佛兾其輪回又有腦骨深大者則以盛淨水供佛名天靈碗皆胡僧之教也豫使迹所及歷趙秦伊周四王府朝見日皆有宴惟秦王親宴于承運門品饌豐盛餘皆長史陪宴賓館成禮而已聞秦王之母太妃陳氏賢而且嚴每朝使至必令王出宴云非惟見爾敬重朝廷好言好事亦得見聞若在宫中不過與婦人相接而已實有何益酒殽已具必令人舁入觀之如不佳典膳厨役皆受撻辱王之所以無失禮賔客者由太妃之賢也各鎮戍鎮守內官競以所在土物進奉謂之孝順陜西有木實名榅桲肉色似桃而上下平正如柿其氣甚香其味酸澀以蜜制之嵗為進貢然終非佳味也太監王敏鎮守陜西時始奏罷之省費頗多敏本漢府軍餘善踏鞠宣府愛而閹之常熟知縣郭南上虞人虞山出軟栗民有獻南者南亟命種者悉拔去云異日必有以此殃害常熟之民者其為民逺慮如此因類記之環慶之墟有鹽也産鹽皆方塊如骰子色瑩然明徹蓋即所謂水晶鹽也池底又有鹽根如石土人取之規為盤盂凡煮肉貯其中抄勻皆有鹹味用之年久則日漸銷薄甘肅靈夏之地又有青黃紅鹽三種皆生池中陜西布政司本唐宰相府前堂屏扆後有方石池中刻波浪紋云是宰相氷果之器後堂􅉉下有一石池中地稍髙四周有走水渠云是宰相用以割羊又有釘官石石理中斷釘歷歷可見云唐舉子以此自占凡釘入者終身利達不入者不利往往有驗云焚書秪是要人愚人未愚時國已墟惟有一人愚不得又從黃石授兵書此焚書抗詩不知何人所作家君常誦之坑在驪山下即坑儒谷是也正統己巳車駕蒙塵敵勢甚熾羣情騷然太監金英集廷臣議其事衆囁嚅久之翰林徐珵元玉謂宜南遷英甚不以為然適兵部尚書于謙奏欲斬倡南遷之議者衆心遂決景皇帝既即位意欲易儲一日語英曰七月初二日東宫生日也英叩頭云東宫生日是十一月初二日上為之默然蓋上所言者謂懷獻英所言者謂今上也意與獻陵之對正相似珵後改名有貞陜西環縣界有唐時木波合道等城遺址志書以為范文正公守環時所築嘗考之唐德宗興元十三年二月集方渠合道木波三城邠寧節度使楊朝晟之力也文正公或因其舊址而修築之故云溫泉在臨潼縣驪山北麓即唐之華清宫故址山上有玉女祠乃其發源處唐時每嵗臨幸宫殿壯麗今惟此池存焉上覆屋數楹四周甃以甓石其水寒暖適調清徹可鑑絲髮湯泉若句容宣府遵化等處亦有之其佳勝宜莫如此然以官府掌之非貴宦無由得浴其外别引泉為男女混堂二處則居民共之居庸關外抵宣府驛遞官皆百户為之陜西環縣以北抵寧夏亦然蓋其地無府州縣故也然居庸以北水甘美榖菜皆多環縣之北皆鹻地其水味苦飲之或至泄利驛官於冬月取雪實窖中化水以供上官尋常使客罕能得也吾蘇陳僖敏公鎰為都御史巡撫陜西時用法寬平臨事簡易數年間雨暘時若年榖屢登民信愛之以其美髯鬛呼為鬍子爺爺嘗以議事還朝民訛傳得代遮道借留者數千人公諭以當復來始稍稍散去及其復來焚香迎候亦然民父母及身有疾者發願為公舁轎則不事醫藥祈禱輒愈一出行臺人爭舁之雖禁之不息也及公去有畫像事之者其得民如此代公者欲懲其弊而濟之以猛識者亦以為宜然民雖陽畏而隂實怒之且旱潦相仍邉事日作非復昔時之氣象矣故善論公者以為非但其德有以惠乎民而其福之庇乎民者亦博矣陜西都指揮司整幼嘗結數惡少為義弟兄一人受挫則共力復仇整嘗擊殺一人於都市歌樓主家執之不力𬒳脫去乃執其與劉某於官究整所在劉曰我實殺之非整也衆證為整劉自認益堅法司不能奪乃論死後得末減發充遼東三萬衛軍整德之每嵗供其軍資時整有老母故劉誣代之古之俠士不能過也太監牛玉之敗南京六科給事中王徽等因上疏言宦官干政專權置立私宅等事皆祖宗時所無請一切禁革之其言讜直切中時弊徽等各調任逺州判官天下之士莫不慕其風采徽字尚文南京人丙戍嵗豫犒師寧夏過寧州聞判官李某數中人問及此事李云始謀於王淵志默志默恐同寮有進止者乃焚香告天以為盟奏本則各草一通俱送尚文以備采取若為首則六科以次列名不容退避蓋舊規也志默紹興山隂人謫四川茂州判官豫以此舉徽擅其名而淵之力居多故表著之陜西城中舊無水道井亦不多居民日汲水西門外參政余公子俊知西安府時以為關中險要之地使城閉數日民何以生始鑿渠城中引灞滻水從東入西出環甃其下以通水其上仍為平地迤邐作井口使民得以就汲此永世之利也西嶽華山西鎮吳山皆在陜西境內載在祀典而西安又有五嶽廟陳僖敏巡撫時既不能毁而又奏請重修之失禮甚矣况勞民傷財在所得已此不學之過也水東日記云世稱警悟有局幹人曰乖覺于兵部奏內常用之然未見所出乃引韓退之羅隱乖角字以為與今乖覺意正相反蓋奏詞移文間用方言時語不必一一有出也今之所謂乖即古之所謂黠黠豈美德哉韻書訓乖云戾也背也離也凡乖者必與人背離如與人相約諫君劾姦死難稍計利害則避而違之以自全反謂不違者為癡此正所謂乖角耳正統丙辰狀元周旋溫州永嘉人聞閣老預定第一甲三人候讀卷時問同在內諸公云周旋儀貌如何或以豐美對閣老喜及傳臚不類所聞蓋豐美者嚴州周瑄聼之不真而誤對耳天順庚辰曹欽反連捕其黨馮益損之甚急一星士馮益謙之就逮亦棄市蓋二人皆寧波人且同名故有此誤人之禍福固非偶然然亦有如此者所謂命也慶陽西北行二百五十里為環縣縣之城北枕山麓周圍三里許編民餘四百户而城居者僅數十家戍兵僦屋閭巷不能容至假學宫居之其土沙瘠其水味苦乍飲之病脾泄出趙大夫溝者味甘然去城十餘里嵗祀先師則取釀酒不可以給日用也驛廩稍供稻米蓋買諸慶陽粟一斗得稻米一升薪木則買諸開城開城亦小邑去環八十里地有美薪其愈環可知矣其古迹則靈武臺在焉唐肅宗以太子即位其處城之南有唐時木波合道等城遺址尚存居數日校官率舉業弟子五六人執經請益咸謹朴使之析義理皆頗能之與談古今及它文事類莫能知嘗與索韻書遍城中不可得蓋其地僻陋無賢師友校官來師者各以所通經授弟子或不久去則貿貿焉無能成其終者無惑乎人才之難也巡撫陜西都憲嘉禾項公忠令慶陽邠寧州縣督民種樹道傍民頗怨之巡撫延綏都憲廣東盧公祥有詩嘲之其終篇云可惜路旁如許地只栽榆栁不栽桑項公和韻云老我豈無衣食計安知此地不宜桑二詩今在慶陽公館壁間邠寧慶陽皆古豳地七月之詩言蠶桑之事備矣要之盧公之言得之莊浪參將趙妥兒土人也嘗馬蹶視土中有物得一刀甚異每地方將有事則自出其鞘者寸餘鞘當刀口處常自割壞識者云此靈物也宜時以羊血塗其口妥兒賴其靈每察見出鞘則預為之備以是守邉有年則無敗事太監劉馬兒還朝日求此刀不與以是掩其功不得升民間俗諱各處有之而吳中為甚如舟行諱住諱翻以箸為快兒幡布為抹布諱離散以梨為圓果傘為竪笠諱狼籍以榔捶為興哥諱惱躁以謝竈為謝歡喜此皆俚俗可笑處今士大夫亦有犯俗稱快兒者洪武中朝廷訪求通曉歷數數往知來試無不驗者必封侯食祿千五百石山東監生周敬心奏言國祚長短在德厚薄非歷數之可定三代有道之長固所定論三代而下深仁厚德者漢唐宋而已如漢高之寬仁繼以文景之恭儉昭宣之賢明光武之中興章帝之長者唐太宗之力行仁義宋太祖之誠心愛民是以有道之長國祚最短者莫如秦其次如隋又其次如五代始皇之酷虐煬帝之苛暴五代之窮凶是皆人事所致豈在歷數欽惟聖上應天眷命混一區宇救亂誅暴其功大矣然神武過於漢高而寬仁不及賢明過於太宗而忠厚不及是以御宇以來政教未敷四方未治伏乞效漢高之寬仁同太宗之誠慤法三代之稅斂則帝王之祚可傳萬世又何必問諸小技之人邪又言陛下連年逺征臣民萬口一辭皆知為耻不得傳國寶欲取之耳臣聞傳國寶出自戰國楚平王時以卞和所得之玉琢之秦始皇祕之名曰御璽自是以來歷代珍之遂有是名易曰聖人之大寶曰位何以守位曰仁是知仁乃人君之寶玉璽非寶也且戰國之君趙先得寶而國不守五代之君皆得寶皆不旋踵而亡蓋徒知玉璽之為寶而不知仁義之為大寶故也天下治安享國之久者莫如三代三代之時未有玉璽是知有天下者在仁義而不在此璽亦明矣今為取寶使兵革數動軍民困苦是忽真正之大寶而易無用之小寶也聖人智出天下明照萬物何乃輕此而重彼愛彼而不愛此邪又言方今力役繁難户口雖多而民勞者衆賦斂過厚田糧雖實而民窮者衆教化博矣而民不説所謂徒善也法度嚴矣而民不服所謂徒法也昔者汲黯言於漢武帝曰陛下內多欲而外施仁義奈何欲效唐虞之治乎方今國則願富兵則願強城池則願高深宫室則願華麗土地則願廣人民則願衆於是多取軍士廣積錢財征伐之舉無虛日土木之功無已時如之何其可治也又言洪武四年欽録天下官吏十三年連坐胡黨十九年起天下積年民害二十三年大殺京民此妄立罪名不分臧否一概殺之豈無忠臣烈士善人君子誤入名項之中於兹見陛下之德薄而殺戮之機深矣夫自古不嗜殺人者能一天下而殺之多者後嗣不昌秦隋元魏之君好殺不已其後至於滅絶種類漢時誤殺一孝婦致東海枯旱三年方今水旱連年未臻大稔未必不由殺戮無辜感傷和氣之所致也又言明主之制賞不僣刑不濫今刑既濫矣復賞賜無節天下老人非功非德人賜鈔五定出征軍官位高而祿厚平寇御侮亦其職分當然今乃賞賜無極夫厚斂重科窮民困苦而濫賜無功之人甚無謂也宜節無功之賞以寬窮民之賦則天下幸甚萬姓幸甚其餘若通鈔法罷充軍等事皆切時弊約三千餘言節其要録之敬心不知為山東某州縣人後仕某官問之山東仕於朝者皆莫之知已無官守言責而能直言如此何其壯哉不可泯也孟子云傅説舉於版築之間屈原云説操築於傅巖兮武丁用而不疑二書築字猶周詩築室百堵之築蔡氏注説築傅巖之野云築居也今言所居猶謂之卜築蓋以版築胥靡之事説賢者不宜有此為賢者諱故云然爾然孟屈去殷周未逺必有所傳况耕稼陶漁不足以病舜釣弋獵較不足以纍孔窮而操築亦何足以為説諱乎古人於圖畫書籍皆有印記云某人圖書今人遂以其印呼為圖書正猶碑記碑銘本謂刻記銘於碑也今遂以碑為文章之名莫之正矣前輩詩文稿不愜意者多不存獨於墓志表碣之類皆存之者蓋有意焉景泰甲戍進士薊州錢源其先崑山人嘗以公差過崑訪求其祖墓父老無能知者居數日沈通理檢家藏前人墓志得洪武七年邑人盧熊所為錢瑞妻章氏墓志始知其祖墓在今儒學之後而封表之於是知葬埋之不可無志而志葬者世系墓地尤不可以不詳也士大夫得親戚故舊墓文必收藏之而不使之廢棄亦厚德之一端也源本沙頭郁氏子郁與錢世連姻錢無子郁以一子為其後後戍薊州郁今為醫官錢氏則已絶矣吳中鄉村唱山歌大率多道男女情致而已惟一歌云南山腳下一缸油姊妹兩箇合梳頭大箇梳做盤龍髻小箇梳做揚籃頭不知何意朱廷評樹之嘗以問豫豫思之翼日報云此歌得非言人之所業本同厥初惟其心之趣向稍異則其成就遂有大不同者作如是觀可乎樹之云君之頴悟過我矣作如是觀此山歌第一曲也菽園雜記卷一
