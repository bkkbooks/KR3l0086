body:
  text: 菽園雜記卷十五明陸容撰朱子注易雖主尚占立說而其義理未嘗與程傳背馳故本義於卦爻中或云說見程傳或云程傳備矣又曰看其易須與程傳參看故本朝詔告天下易說兼主程朱而科舉取士以之豫猶記幼年見易經義多兼程傳講貫近年以來場屋經義專主朱說取人主程傳者皆被黜學者靡然從風程傳遂至全無讀者嘗欲買周易傳義為行篋之用遍杭城書肆求之惟有朱子本義兼程傳者絶無矣蓋利之所在人必趨之市井之趨利勢固如此學者之趨簡便亦至此哉聞天順間沛縣民楊四家鋤田得一古銅器狀如今香爐有耳而無足洗去土有聲如彈琵琶不已其家以為怪碎之不知何物也成化甲辰泗州民家牛生一麟以為怪殺之工侍賈公俊時公差至此得其一足歸足如馬蹄黃毛中肉鱗𨼆起皆如半錢永康尹崑城王循伯時為進士親見之云然𢎞治五年揚之瓜州聚船處一米商船被雷擊折其桅近本處大小鼠若干皆死蓋鼠齧空而窟宅其中也大鼠一重七斤小鼠約二斗鄉人印綬初聞而未信嘗親問其船主云然意者天恐風折於揚帆時致誤民命故擊之耶嘗記正統十年豫家祖園新竹二本皆自數節以上分兩岐交翠可愛家僕俟其老斫而芟去旁枝用以叉取薀草飼豬景泰二年新居後園黃瓜一蔓生五條結蒂與脫花處分張為五瓜之背則相連附園丁採入衆玩一過兒童擘而食之後仕于朝有以瑞竹瑞瓜圖求題詠者閲之則皆豫家所嘗有也况他竹之瑞一本豫家並生二本他瓜僅二三又非連理豫家五瓜連理不尤瑞乎使當時長老父兄有造言喜事者諂諛歸之府縣誇艷歸之家庭動衆傷財其為不靖多矣惟其悃愊無華故人之所謂祥瑞一切不知動其心惟不知動其心故驕侈不形而災害不作可以保其家於悠久也傳曰天下本無事庸人自擾之其斯之謂與左氏莊周屈原司馬遷此四人豪傑之士也觀其文章各自成一家不事蹈襲可見矣史遷纂述歷代事跡其勢不能不襲若左莊屈三人千言萬語未嘗犯六經中一句宋南渡後學者無程朱緒餘則做不成文字而於數子亦往往妄加貶議可笑也先儒謂左氏浮夸莊周荒唐屈原懟怨此公論也謂莊周為邪說而闢之亦公論也若左氏春秋傳自是天地間一種好文字而或者以其為巧言豈不過哉為此言者正猶貧人喫齊以文其貧舍曰珍羞品味力不能辦而必謂其腥羶不堪食矯誣孰甚焉南京諸衛官有廨宇軍有營房皆洪武中之所經畫今雖間有頽廢而其規址尚存北京自永樂十九年營建告成鑾輿不復南矣至𢎞治元年閲六十八年而軍衛居址尚有未立者彼固不能陳乞建立而上司亦未之念及也是年襄城馬公文升掌都察院事奏毁天下淫祠豫嘗建白欲以城中私創菴院置衛則財不煩官力不勞下其功易成事寢不行吾崑山知縣楊子器毁城市鄉村菴院神祠約百餘所以其材修理學校倉廪公館社學樓櫓等事一時完美又給發餘材太倉鎮海二衛凡所頽廢率與興舉軍民至今德之使當路有子器其人則國家之廢事以舉官府之缺典以完又何難哉豫觀政工部時葉文莊公為禮部侍郎嘗欲取吾崑元宋國初以來諸公文集擇其可傳者或詩或文人不出十篇名曰崑山片玉以傳命豫採集之若郭翼羲仲林外野言殷奎孝章强齊集袁華子英耕學稿易恆久成泗園集吕誠敬夫來鶴軒集朱德潤澤民存復齊稿偶桓武孟江雨軒詩林鐘仲鏞松谷集沈丙南叔白雲集馬麟公振淞南漁唱屈昉李明寓菴集王資之深瑞菊堂集鄭文康時乂平橋稿之類不久豫除南京吏部主事恐致遺失俱以送還鄉先輩之美竟泯泯矣可勝嘆哉遜志齊集三十卷拾遺十卷附録一卷台人黃郎中世顯謝侍講鳴治所輯今刻在寧海縣其二十八卷內勉學詩二十四章本蘇士陳謙子平所作誤入方集耳子平元末人張士誠兵至吳有突入其室者脋其兄訓使拜不屈創其胸子平以身翼蔽并遇害平生著述甚富兵後散亡獨所著易解詁二卷及古今詩數十篇傳于世正統間吾崑山所刻養蒙大訓收其詩豫幼嘗見之京師士人徐本以道亦嘗刻其詩印行後有國初韓奕公望跋語韓徐皆蘇人京師東厰者掌巡邏兵校之地也𢎞治癸丑五月忽風大作地陷約深二三丈許廣亦如之明時坊白晝間二人入巡警鋪久不出管鋪者疑之推戶入視但見衣二領委壁下衣旁各有積血而不見其人六月六日通州東門外訛言冦至男婦奔走入城跋涉水潦多溺死者竟日聞馬進士慶云晦菴先生家墳墓乃先生自觀溪山向背而為之面值一江有沙亘其間先生嘗云此沙開時吾子孫當有入朝者其家有私記存焉景泰間朝廷念其有功於世求訪其子孫於是九世孫梴徴入朝授五經博士世官一人主祀公文未至之數日其沙忽被水衝開適中其言崑城夏氏與處州衛一指揮為親舊指揮聞夏氏有淑女求為子婦數年未成後求之益力家人皆許之女之祖獨不許因㑹客以骨牌為酒令祖設難成之計謂求婚者云蒱牌若得天地人和四色皆全即與成婚一拈而四色不爽衆驚異遂許之太倉曹用文查用純素友善適其妾各有娠一日㑹飲戲以骰子為卜云使吾二人一擲而六子皆紅必一男一女當為婚姻一擲並如其卜既而查生男曹生女查以子贅曹為壻云此二事相類特甚蓋亦非偶然也江西山水之區多産蛟蛟出山必裂水必暴湧蛟乘水而下必有浮菹擁之蛟昻首其上近水居民聞蛟出多往觀之或投香紙或投紅綃若為之慶賀者然云蛟狀大率似龍但蛟能害及人畜龍則不然龍能飛且變化不測蛟則不能也慶元初韓托胄既逐趙忠定太學生敖陶孫賦詩于三元樓上云左手旋乾右轉坤如何羣小恣流言狼胡無地居姬旦魚腹終天弔屈原一死固知公所缺孤忠幸有史長存九原若遇韓忠獻休說渠家末世孫陶孫方書于樓壁酒一再行壁已不存陶孫知詩必為韓所亷得捕者將至急更行酒者衣持暖酒具下樓捕者與交臂問以敖上舍在否敖對以若問太學秀才耶飲方酣陶孫亟亡命歸走閩後登乙丒第此出杭志紀遺陶孫字器之宋慶元五年曾從龍榜進士奉議郎泉州僉判其名銜僅見崑山志進士題名中而不知其何如人觀此則其為人可知矣宋神宗問吕惠卿何草不庶獨蔗從庶何也惠卿曰凡草種之則正生甘蔗種之則旁生上喜之按六書有諧聲蔗庶聲庶古遮字非㑹意也若蔗以旁生從庶則鷓鴣蟅蟲亦旁生耶聞本朝天順間睿皇欲除某為翰林學士以翰林已有三員疑其過多兵部尚書陳汝言適侍側叩頭云唐朝學士十八人聖朝三四人何多上喜之遂决蓋唐之十八人太宗為太子時私引文學之士以為馮翼非以學士名官也學士美官其濫如此可乎小人之率爾妄對類如此中吳紀聞六卷每卷首題云崑山龔明之前有明之淳熙元年自序後有至正二十五年吾崑盧公武記得書來歷及校正增補大略且云非區區留意郡志此書將泯沒而無聞矣𢎞治初崑令楊子器翻刻印行考之宣德崑山志不載此人近檢公武蘇州府志具明之孝行甚詳蓋公武之志人物間有略其邑里者崑山志孝友類載馬友直周津曹椿年皆本之郡志而明之獨遺之其以是歟米南宫以書畫名一時其文章不多見家藏故紙中有露斤烈女碑文一通辭亦清古今維揚新志已收入兹不録録其贊云王化煥兮盛江漢叔運煽兮人倫亂一德彥兮昭世典情莫轉兮天質善楚澤緬兮雲木偃煒斯囝兮日星建此贊每句二韻亦新竒囝與繭音同閩人呼其子云然古韻書無之蓋後世方言耳昔劉夢得以糕字不經見詩中輒不敢用囝惟顧况有詩陸放翁亦有阿囝略如郎罷意之句然用之閩越似亦無害江淮之俗故所未聞也而施之刻石之文何耶本朝文武衙門印章一品二品用銀三品至九品用銅方幅大小各有一定分寸惟御史印比他七品衙門印特小且用鐵鑄文皆九疊諸司官銜有使字者司名印文亦然惟按察使官銜有使字而司名印文無之此所未喻也軍衛千戶所有中左右前後之别而所統千百戶印文但云某衛某千戶所百戶印十印皆同不免有那移詐僞之弊若於百戶上添第一第二等字則無弊矣魏文靖公驥為南京禮部侍郎時嘗積求文銀百餘兩置書室中失去邏者廉知為一小吏所盜發其藏已費用一紙裹餘尚在也當送法司治罪公憐其貧且將得冠帶曰若置之法非惟壞此吏其妻子恐將失所遂釋之提督徐州倉糧太監韋通嘗於桓山寺鑿井深數丈聞鍤下有聲鏗然得獨輪銅車一具其色緑如瓜皮通命磨洗視之上有識文云陸機造重三十鈞推之輪轉而可行遂進於朝時憲宗方好古器物得之甚喜受賞頗多成化乙巳歲也丘閣老世史正綱唐德宗興元元年書始賜有功將士以功臣名號其目云所謂奉天定難功臣是也然其所謂奉天者以地言也後世遂襲之以為奉天命失初意矣今按五代及宋元固皆襲唐號若本朝功臣勳階雖有奉天翊衛等字然朝廷正殿正門皆名奉天凡詔赦及封贈文武官誥勑起語皆曰奉天承運其主意正謂天子奉承天命以治天下故事必稱天非襲唐奉天之名也𢎞治六年癸丑十二月三日之夕南京雷電交作次日大雪自是雪雨連隂浹月始晴考之周密野語記元至元庚寅正月二十九日未時電光繼以大雷雪下如傾是年二月三日春分又記客云春秋魯𨼆公九年三月即今之正月三國吳主孫亮太平二年二月晉安帝元興三年正月義熙六年正月皆有雷雪之異義熙以前云皆未考至元庚寅密所親見也然皆在正二月今癸丑十二月六日大寒二十一日才立春尤異也北方有蟲名蚰蜒狀類蜈蚣而細好入人耳聞之同寮張大器云人有蚰蜒入耳不能出初無所苦久之覺腦痛疑其入腦甚苦之而莫能為計也一日將午飯枕案而睡適有雞肉一盤在旁夢中忽噴嚏覺有物出鼻中視之乃蚰蜒在雞肉上自此腦痛不復作矣又同寮蘇文簡在山海關時蚰蜒入其僕耳文簡知雞能引出急炒雞置其耳旁少頃覺有聲鍧然乃此蟲躍出也熊去非嘗論孔廟諸賢位置大意謂四配中若復聖宗聖述聖三公各有父在廡下揆之父子之分其心豈安宜作寢殿以叔梁紇為主配以無繇子㸃伯魚孟孫氏於禮為宜愚謂無繇子㸃伯魚三人祀之别室當矣叔梁紇之為主亦無謂孟孫氏非聖賢之徒何可與此此尤迂繆之見也鄉人嘗言野中夜見鬼火神火鬼火色青熒不動神火色紅多飛越聚散不常蓋火為陽精物多有之世知木石有火而已如龍雷皆有火夏天久旱則空中有流火今謂之火殃是已海中夜亦見火肥貓暗中抹之則火星迸出壯夫梳髮亦然積油見日亦生火古戰場有燐火魚鱗積地及積鹽夜有火光但不發焰此蓋腐草生螢之類也古人詩集中有哀挽哭悼之作大率施於交親之厚或企慕之深而其情不能已者不待人之請也今仕者有父母之喪輒遍求挽詩為冊士大夫亦勉強以副其意舉世同然也蓋卿大夫之喪有當為神道碑者有當為墓表者如內閣大臣三人一人請為神道一人請為葬志餘一人恐其以為遺已也則以挽詩序為請皆有重幣入贄且以為後㑹張本既有詩序則不能無詩於是而遍求詩章以成之亦有仕未通顯持此歸示其鄉人以為平昔見重於名人而人之愛敬其親如此以為不如是則於其親之喪有缺然矣於是人人務為此舉而不知其非所當急甚至江南銅臭之家與朝紳素不相識亦必夤緣所交投贄求挽受其贄者不問其人賢否漫爾應之銅臭者得此不但裒冊而已或刻石墓亭或刻板家孰有利其贄而厭其求者為活套詩若干首以備應付及其印行則彼此一律此其最可笑者也今雲南廣西等處土官無嗣者妻女代職謂之母土官隋有譙國夫人洗氏高凉太守馮寶妻也其家纍葉為南越首領跨據山洞部落十餘萬家夫人在母家撫循部衆能行軍用師壓服諸越後以功致封爵此女土官事始但夫人父家有兄夫家有子與今不同耳𢎞治癸丑五月薊州大風雷牛馬在野者多喪其首又民家一産五子三男皆無首肢體蠢動二女臍下各有口眼啼則上下相應數日皆死唐詩大家並稱李杜蓋自韓子已然矣或疑太白才氣豪邁落筆驚人子美固已服之又官翰林清切之地故每親附之杜詩後人始知愛重在當時若太白蓋以尋常目之故篇章所及多不酬答今觀二公集中杜之於李或贈或寄或憶或懷或夢為詩頗多其散見於他作如云李白斗酒詩百篇近來海內為長句汝與山東李白好南尋禹穴見李白道甫問訊今何如之類褒譽親厚之意不一而足及觀李之於杜惟沙丘城之寄魯郡東石門之送飯顆山之逢僅三章而已况沙丘石門略無褒譽親厚之詞而飯顆山前之作又涉譏謔此固足起後人之疑也嘗聞鄉老沈居竹云飯顆山天下本無此名白以甫窮餓寓言譏之未知然否病霍亂者濃煎香薷湯冷飲之或掘地為坎汲井水於中取飲之亦可最忌飲熱湯熱米湯者必死詩兼美刺寓勸懲先王之教也故有矢詩之典有采詩之官蓋將以知政治之得失風俗之美惡民生之休戚以求有補於治未聞以詩而致禍者自後世教化不明邪佞希㫖在上者懷猜忌之心在左右者肆讒賊之口於是乎詩禍作矣唐以詩賦取士故詩學之盛莫過於唐然當時詩人往往以國事入詠而朝廷亦不之禁可謂寬大矣但尊者之失亦所當諱而時皆昧之何耶姑以易見者言之如三郎沈醉打毬回虢國夫人承主恩如何四紀為天子不及盧家有莫愁是何美事而形之詠歌固已顯其君上之失矣至若薛王沈醉壽王醒之句雖前人嘗辨薛王早薨未嘗與貴妃同宴龍池然壽王之醒觸犯忌諱尤非臣子所忍言者使猜忌之君觀之寧不槩以賢人君子之為詩皆敢於攻發君上隂私者耶故一有讒譛皆信之不疑而傷害隨之矣豫嘗謂後世詩禍實唐人有以貽之也甲寅六月六日蘇州衛印紐熱炙手不可握吏以告衛官各親手握之始信乃以布裹而用之亦可異也班孟堅漢書大抵沿襲史記至於季布蕭何袁盎張騫衛霍李廣等贊率因史記舊文稍增損之張騫贊即史記大宛傳後或有全用其語者前作後述其體當然至如司馬相如傳贊乃固所自為而史記乃全載其語而作太史公曰何耶又遷在武帝時雄生漢末安得謂揚雄以為靡麗之賦勸百而風一哉諸家注釋皆不及之又公孫𢎞傳在平帝元始中詔賜𢎞子孫爵徐廣注謂後人寫此以續卷後然則相如之贊亦後人勦入而誤以為太史公無疑至若管仲傳云後百餘年有晏子孫武傳云後百餘歲有孫臏屈原傳云後百餘年有賈生皆以其近似類推之耳至於優孟傳云其後二百餘年秦有優旃而淳于髠傳亦云其後百餘年楚有優孟何耶殊不知優孟在楚莊王時淳于在齊威王時謂前百餘年楚有優孟可也今乃錯謬若此且先傳髠而後叙孟其次序曉然謂之非誤可乎此出齊東野語常見元吳文正公本朝王忠文公讀史記伯夷傳疑其不倫皆有所更定竊嘆服前賢讀書精察如此近見此語又以嘆公謹識見之明雖前代深於史學者亦未之覺也因記之與讀史者共焉菽園雜記卷十五
