body:
  text: 菽園雜記卷三明陸容撰本朝六卿之設雖祖周官而六部之名實沿唐制但唐之六部為尚書省之屬曹本朝六部為六尚書之公署唐以為省名今以為官名為不同耳唐尚書省之制都堂在中尚書令左右僕射左右丞各一人居之吏户禮三部在東兵刑工三部在西每部尚書左右侍郎各一人各統四司六部之外又有左右二司每司各有郎中員外郎分理庶務署覆文案則有主事今之六部特尚書一省之官户刑二部屬司比唐制加多耳又如唐中書省有令有侍郎中書舍人通事舍人官屬頗多今革中書省止存中書舍人而已唐門下省有給事中等官今革門下省改通政司止存其屬給事中分六科而已唐御史臺有御史大夫御史中丞其屬有三院臺院侍御史𨽻焉殿院殿中侍御史𨽻焉察院監察御史𨽻焉今改御史臺為都察院革侍御史殿中御史止存監察御史分道理事特唐三院之一耳唐有學士院翰林院集賢院𢎞文館今皆革去止存翰林院其餘諸司减省於唐不能悉數好議者輒謂本朝官制冗濫其亦未之考邪國初欲建都鳳陽其城池九門正南曰洪武南之左曰南左甲第右曰前右甲第北之東曰北左甲第西曰後右甲第正東曰獨山東之左曰長春右曰朝陽正西曰塗山後定鼎金陵乃設中都留守司於此金陵本六朝所都本朝拓其舊址而大之東盡鍾山之麓城池周廽九十六里立門十三南曰正陽南之西曰通濟又西曰聚寶西南曰三山曰石城北曰太平北之西曰神䇿曰金川曰鍾阜東曰朝陽西曰清凉西之北曰定淮曰儀鳳後塞鍾阜儀鳳二門其外城則因山控江周廽一百八十里别為十六門曰麒麟曰仙鶴曰姚坊曰高橋曰滄波曰雙橋曰夾岡曰上方曰鳳臺曰大馴象曰大安德曰小安德曰江東曰佛寧曰上元曰觀音永樂十七年改北平為北京十九年營建宫殿尋拓其故城規制周廽四十里凡九門正南曰正陽南之左曰崇文右曰宣武北之東曰安定西曰德勝東之南曰朝陽北曰東直西之南曰阜成北曰西直然其時尚稱行在正統七年諸司題署始去行在字舊都諸司印文皆增南京字而兩京之制於是定矣崑山本古婁縣梁大同初改今名其山在今松江府華亭縣界晉陸氏兄弟機雲生其下皆有文學時人比之崑山片玉故名唐吳郡太守趙居貞奏割崑山嘉興海鹽三縣地立華亭縣山始分屬焉今為松江九峯之一崑山縣治北之山自名馬鞍縣志引劉澄之揚州記甚明或有稱玉峯者蓋擬之耳然崑山之神載在祀典其祠舊在馬鞍山東偏又似以馬鞍為崑山者皇陵初建時量度界限將築周垣所司奏民家墳墓在旁者當外徙高皇云此墳墓皆吾家舊鄰里不必外徙至今墳在陵域者春秋祭掃聼民出入無禁此言聞之鳳陽尹杜長云於此可見帝皇氣象包含遍覆自異於尋常萬萬也南京通政司門下有一紅牌書曰奏事使云洪武間凡有欲奏事不得至御前者取此牌執之可以直入內府各門守衛等官不敢阻當國初通逹下情如此成化初年南京通政司官遇告狀有所知名則不受甚者撻而逐之祖宗之法蓋蕩然矣南京各部皂𨽻俱戴漆巾惟禮部無之諸司前門俱有牌額惟兵部無之云洪武中邏卒常隂伺諸司得失禮部皂𨽻嘗晝寢兵部夜無巡警皆𬒳邏者取去故至今猶然吏部後有敬亭者仁廟為皇太子監國時吏部選官謂之敬選故云永樂七年太監鄭和王景𢎞侯顯等統率官兵二萬七千有竒駕寶船四十八艘齎奉詔㫖賞賜歷東南諸蕃以通西洋是嵗九月由太倉劉家港開船出海所歷諸蕃地面曰占城國曰靈山曰崑崙山曰賔童龍國曰真臘國曰暹羅國曰假馬里丁曰交闌山曰爪哇國曰舊港曰重迦邏曰吉里地悶曰滿剌加國曰麻逸凍曰􅀢坑曰東西竺曰龍牙加邈曰九州山曰阿魯曰淡洋曰蘇門答剌曰花面王曰龍嶼曰翠嵐嶼曰錫蘭山曰溜山洋曰大葛闌曰阿枝國曰榜葛剌曰卜剌哇曰竹步曰木骨都東曰阿丹曰剌撒曰佐法兒國曰忽魯謨斯曰天方曰琉球曰三島國曰浡泥國曰蘇祿國至永樂二十二年八月十五日詔書停止諸蕃風俗土産詳見太倉費信所上星槎勝覽羅修撰倫上疏論閣老南陽李公奪情事調泉州市舶提舉章編修懋黃編修仲昭莊檢討昶皆上疏論元夕觀燈事章調知臨武黃調知湘潭莊調桂陽州判官李公歿後淳安商公復入閣言於上皆得復其官於是羅為南京翰林修撰章黃皆為南京大理評事莊為南京行人司副適廬陵陳公文亦卒士人有為詩悼之者末二句云九原若見南陽李為道羅生已復官蓋章黃莊三人之謫實出上意而羅之謫李公不能無意故云先是大臣遭父母喪奪情起復者比比皆是至是始著為令皆終喪三年奪情起復者亦間有之實出朝廷勉留非復前時之濫是則羅生一疏之力也宣德間大理寺卿胡槩巡撫南直𨽻用法嚴峻凡豪右之家素為民害者悉𬒳籍其産徙置逺方雖若過甚而小民怨氣一時得伸周文襄繼之一意寬厚富家大户頗𬒳帡幪有告訐者亦不輕理一訐者面斥公曰大人如何不學胡卿使我下情不能上達公從容語之曰胡卿勑書令其祛除民害我勑書只令撫安軍民朝廷委託不同溫顔遣之人服其量嘗有人臨刑以三覆奏得免或問當此時自覺心神何如云已昏然無所知但記身坐屋脊上下見一人面縛我妻子親識皆在其傍少頃報至才得下屋蓋上屋者其魂所見面縛者其身也觀此則世俗落魂之說信有之矣文皇兵至濟南城未下以箭書射城中促降時國子監生濟陽高賢寧適在城中乃作周公輔成王論射城外乞罷兵未幾城下賢寧𬒳執云此即作論秀才文皇曰好人也欲官之固辭其友紀綱勸令就職賢寧曰君是學校棄才我已食廩有年不可也綱言於上全其志而遣之年九十七而終蓋綱前時𬒳黜生故云棄才於是見賢寧守身之節文皇待士之度兩得之矣吳下每有鄉村小夫語言應對全不務實問其里居如安亭則曰安溪茜涇則曰茜溪石浦則曰石川芝塘則曰芝川疁塘則曰疁溪塗松則曰松溪但取新美不知失其義理蓋亭乃漢制鄉都之名如華亭夷亭望亭皆古名塘浦乃吳中水道之名川與溪則水出兩山之間大而駛者如蜀之東西川越之剡溪婺之蘭溪湖之苕霅等溪是矣蘇松之地平疇千里塘浦濱港經緯其間通潮處其水以時長落無潮處其水平漫如常與彼異矣必欲以川溪名之亦未為不可但亭與塘浦其名𫝊自古昔初非朝歌勝母之可憎柏人彭亡之可忌不知何辱於此輩而必欲更之邪江西民俗勤儉每事各有節制之法然亦各有一名如喫飯先一碗不許喫菜第二碗才以菜助之名曰齊打底饌品好買猪雜臟名曰狗靜坐以其無骨可遺也勸酒果品以木雕刻彩色飾之中惟時果一品可食名曰子孫果盒獻神牲品賃於食店獻畢還之名曰人沒分節儉至此可謂極矣學生讀書人各獨坐一木榻不許設長凳恐其睡也名曰沒得睡此法可取一二叁肆伍陸㭍捌玖拾阡陌等字相傳始於國初刑部尚書開濟然宋邉實崑山志已有之蓋錢穀之數用本字則姦人得以盜改故易此以關防之耳正統間南直𨽻提督學校御史廬陵孫先生鼎篤信力行之士言行政事足以表儀士類每閲諸生試卷雖盛暑若燈下必衣冠焚香朗誦而去取之侍者勸便服先生曰士子一生功名富貴發軔於此此時豈無神明在上各家祖宗之靈森列左右亦未可知小子豈敢不敬故事士子中小試赴舉者插花掛紅鼓樂道送時睿皇北狩之報方至先生語諸生云天子䝉塵在外正臣子泣血嘗膽之時吾不敢陷諸生於非禮花紅鼓樂今皆不用乃親送至察院前門而還至今人能道之凡小說記載多朝貴及名公之事大抵好事者得之傳聞未必皆實如以舊女壻為新女壻大姨夫作小姨夫之句為歐公者後世娶妻妹輒據以為口實嘗考公年譜公初娶胥氏翰林學士偃之女繼娶楊氏集賢院學士諫議大夫大雅之女三娶薛氏資政殿學士户部侍郎奎之女行狀墓志皆同是知此說好事者為之也此猶未為害事若某詩話記司馬溫公私狎營妓王荆公以詩戲之其為汚染名德甚矣蓋溫公固不為此荆公端人追之戲之恐亦非其所屑為也闢而不信為宜姪本妻兄弟之女古者諸侯之女嫁與諸侯以娣姪從左傳云姪其從姑是已今人稱兄弟之子為姪不知誤自何時唐狄仁傑諫武后云姑姪與母子孰親始見於此然猶稱武姓之子為姪對姑而言之耳此字隨俗稱呼則可若施之文章不若稱從子族子之類之為愈也歐陽公言餕饀之訛最為可笑今俗吏於移文中如價直之直作值槍刀之槍作鎗案卓作案棹交倚作交椅此類甚多使歐公見之當更絶倒也唐制尚書省其屬有六尚書即今六部是已故唐人結銜云尚書某部某官其稱尚書者省名也本朝六尚書乃六部官名六部之屬曰某清吏司各有郎中主之貟外郎主事為佐今人書銜往往蹈襲古式稱尚書某部某官者不講時制而專尚虛夸故也大抵古人結銜多實今人多夸如唐宋人於本銜之外書賜紫金魚袋或實食若干户之類蓋其常得服用者近時京官使外國攝盛而行者則終身書賜一品服嘗與修一統志者則書國志總裁前任南京國子監祭酒後任在京祭酒者則曰兩京國子祭酒有嘗為美官而外𥙷左遷革職者猶書前某官蓋眷戀未能舍也此雖細事亦足以觀人品矣自三代而下縉紳介胄判為二途者久矣然綜理綱維其事武士未之能專也故歷代握兵者必皆文武兼資之才近代若宋之安撫司元之行省皆總州郡兵民之政國朝建置之初一切右武如五軍都督官高六部尚書一階在外都司衛所比布政司府州官亦然然什伍之兵官軍之食修固城隍繕完兵器之財皆自府州縣而出豈可判而為二哉故國初委任權力重在武臣事無不濟承平日久無用武事則其勢自有不可行者矣今天下兵政不立兵威不振正坐此也使當時謀國者為善後之計每都司衛所正官俱設文職一貟佐二仍用武職除民事不預凡軍中事宜與布政使司及府州官㑹同行事庶乎其可也然律令有變亂成法之戒誰得而議之當塗民邵某業合韋事母孝母病瞽日傭歸必買市食以奉母一日邵出其妻得蠐螬蟲數枚炙以奉姑紿云所親佳餽也姑食而美乃留二三啖其子子見之失聲痛哭母𬒳驚雙目忽開明如平時邵欲逐其妻母曰非婦毒我我目當再明天使婦以此醫我也邵乃留之終身洪武中京民史某與一友為火計史妻有美姿友心圖之嘗同商於外史溺水死其妻無子女寡居持服既終其友求為配許之居數年與生二子一日雨驟至積潦滿庭一蝦蟇避水上階其子戲之杖抵之落水後夫語妻云史某死時亦猶是耳妻問故乃知後夫圖之也翌日俟其出即殺其二子走訴於朝高皇賞其烈乃置後夫於法而旌異之好事者為作蝦蟇傳以揚其善今不傳國初江岸善崩土人謂有水獸曰豬婆龍者搜抉其下而然適朝廷訪求其故人以豬與國姓同音諱之乃嫁禍於黿上以黿與元同音益惡之於是下令捕黿大江中黿無大小索捕殆盡老黿逃捕者不上灘淺則以炙豬為餌釣之衆力掣不能起有老漁云此蓋四足爬土石為力耳當以甕穿底貫釣緡而下甕罩其頭必用前二足推拒從而併力掣之則足浮而起矣如其言果然豬婆龍云四足而長尾有鱗甲疑即鼉也未知是否聞黿之大者能食人是亦可惡然搜抉江岸非其罪也夫以高皇之聰明神智人言一遷就禍及無辜如此則朋黨獄興之時人之死於遷就者可勝言哉正統初南畿提學彭御史朂嘗以永樂間纂修五經四書大全討論缺精諸儒之說有與集注背馳者嘗删正自為一書欲繕寫以獻或以大全序出自御製而止以今觀之誠有如彭公之見者蓋訂正經籍所以明道不當以是自沮也洪武中京城一校尉之妻有美姿日倚門自衒有少年眷之因與目成日暮少年入其家匿之牀下五夜促其夫入直行不二三步復還以衣覆其妻擁塞得所而去少年聞之既與狎且問云汝夫愛汝若是乎婦言其夫平昔相愛之詳明發别去復以莫期及期少年挾利刃以入一接後絶婦吭而去家人莫知其故報其夫歸乃托拾素有讐者一二人訟於官一人不勝煆鍊輒自誣服少年不忍其寃自首伏罪云吾見其夫篤愛若是而此婦忍負之是以殺之法司具狀上請上云能殺不義此義人也遂赦之高皇嘗微行至三山街見老嫗門有坐榻假坐移時問嫗為何許人嫗以蘇人對又問張士誠在蘇何如嫗云大明皇帝起手時張王自知非真命天子全城歸附蘇人不受兵戈之苦至今感德問其姓氏而去翌旦語朝臣云張士誠於蘇人初無深仁厚德昨見蘇州一老婦深感其恩何京師千萬人無此一婦也洪武二十四年後填實京師多起取蘇松人者以此後生新進議論政事最宜慎重蓋經籍中所得者義理耳祖宗舊章朝廷新例使或見之未真知之未悉萬一所言乖謬非但詒笑於人而已嘗記初登第後聞數同年談論都御史李公侃禁約娼婦事或問何以使之改業不犯同年李釗云必黥刺其面使無可欲則自不為此矣衆皆稱善豫亦竊識之久矣近得皇明祖訓觀之首章有云子孫做皇帝時止守律與大誥竝不用黥刺剕劓閹割之刑臣下敢有奏用此刑者文武羣臣即時劾奏將犯人凌遲全家處死為之毛骨竦然此議事以制聖人不能不為學古入官者告而本朝法制諸書不可不遍觀而博識也高皇一日遣小內使至翰林看何人在院時危素太朴當直對內使云老臣危素內使復命上默然翌日傳㫖令素余闕廟燒香蓋余危皆元臣余為元死節蓋厭其自稱老臣故以愧之南京國子監日有鴟梟鳴於林間祭酒周先生洪謨惡之令監生能捕逐者放假三日一時斥弛之士多得放假人目為鴟梟公以譏之其後劉先生俊為祭酒好食蚯蚓監生名之曰蚯蚓子以為鴟梟之對豫嘗題墨竹以竹為草或云草以嵗為枯榮竹耐久不雕草何足以當之豫時亦無定見後見山海經叙山之草木每以竹為草屬始自喜有據又見晉人論草木之有竹猶鳥獸之有魚自是天地間一種此說亦竒洪武中大臣為三公者皆開國功臣三孤亦無備貟如劉伯溫汪廣洋寧封伯爵而不以公孤加之其慎重可知矣永樂中惟姚廣孝為少師洪熙宣德以至正統間大臣為三孤者亦不過蹇忠定公義夏忠靖公原吉黃忠宣公福黃文簡公淮數人及內閣三楊公而已至景泰中有以少傅兼太子少師以少保兼太子太傅以太子太保兼尚書都御史以太子少師少傅少保兼侍郎副都御史大理卿通政使又有尚書侍郎兼詹事府詹事等官公孤師少在朝不下二三十貟尚書每部二貟侍郎每部三四貟都御史貟數又有甚焉名爵之濫未有甚於此時者矣故當時謡曰滿朝升保傅一部兩尚書侍郎都御史多似栁穿魚景泰間南京夾岡門外一家娶婦及門肅婦入空轎也壻家疑為所賺訴於法司拘舁夫及從者鞫之衆證云婦已登轎矣法司不能决乃令遍求之得之荒冢中問之婦云中途歇轎二人掖吾入門時吾已昏然且有物蔽面不知其詳至天明始驚在林墓中耳江西南豐縣一寺中佛閣有鬼出沒人不敢登徐生者素不檢朋輩使夜登焉且與約日先置一物於閣翌旦持以為信則衆設酒飲之否則有罰及暮生飲至醉而登不持兵刃惟拾瓦礫自衛而已一更後果有數鬼入自其牖方上梁坐生大呼投瓦礫擊之鬼出牖去生觀其所往則皆入墻下水穴中私識之而卧翌旦日髙未起衆疑其死矣乃從容持信物而下衆醵飲之明日率家僮掘其處得白金一窖六十餘斤佛閣自是無鬼寮友孫司務譓徐州蕭縣人嘗言正統間其里人王某女出嫁中途下車自便忽大風揚塵吹女上空須臾不見里人訛言鬼神攝去父母親族號哭不已是日落五十里外人家桑樹上問知為某村某家女𬒳風括去叩其空中何見云但聞耳邉風聲霍霍他無所見身愈上風愈寒體顫不可忍其家蓋舊識也翌日送歸乃復成婚豫之齒者去其角傅之翼者兩其足或云有齒無角若犬豕似矣牛羊有角未嘗無齒也角當作觜謂鳥咮訛為角耳蓋以為獸豫之角則無鳥之咮鳥傅之翼則無獸之四足翼足互言鳥獸齒角不當專以獸言此說有理但考之韻書觜無釋鳥咮義不知何所據也成化壬辰嵗陜西隴州雨雹大者如牛馬頭次者如碗小者如鵝卵人與牛羊馬驢𬒳打死甚多禾苖盡壞華亭民有母再醮後生一子母歿之日二子爭欲葬之質之官知縣某判其狀云生前再醮終無戀子之心死後歸墳難見先夫之面宜令後子收葬松庭叔父傳道其事云菽園雜記卷三
