body:
  text: 菽園雜記卷五明陸容撰宗人府署印內府管將軍宿衛中都留守舊規皆以國戚充之勳臣非在戚里不得與也今署宗人印者如故管將軍非國戚者自安逺侯桞景始留守非國戚者自都指揮孫安始一則夤緣縉雲侯一則夤緣汪直皆命由中出此亦政體一變也京師元日後上自朝官下至市人往來交錯道路者連日謂之拜年然士庶人各拜其親友多出實心朝官往來則多泛愛不專如東西長安街朝官居住最多至此者不問識與不識望門投刺有不下馬或不過其門令人送名帖者遇黠僕應門則皆卻而不受亦有閉門不納者在京仕者有每旦朝退即結伴事此至入更酣醉而還三四日後始暇拜其父母不知是何風俗亦不知始於何年聞天順間尚未如此之濫也景泰年間吏部尚書王公文户部尚書陳公循皆以少保大學士居內閣王之子倫陳之子瑛順天府鄉試俱不中式二公交章指摘考試官劉儼之失欲罪之上不罪儼而許倫瑛得會試是以阿附者有欽賜舉人之稱此亦一代異事也其後文遇害循謫戍儼卒官諡文介摺疊扇一名撒扇蓋收則摺疊用則撒開或寫作箑者非是箑即團扇也團扇可以遮面故又謂之便面觀前人題詠及圖畫中可見已聞撒扇自宋時已有之或云始永樂中因朝鮮國進松扇上喜其卷舒之便命工如式為之南方女人皆用團扇惟妓女用撒扇近年良家女婦亦有用撒扇者此亦可見風俗日趨於薄也嶽季方能畫葡萄嘗作畫葡萄説近於宣府李士常家見其自書一通筆畫清徑不俗其言葡萄本中國名果重自上古神農九種功力為最世謂得之大宛歸種漢宫皆未之考意者初不經見而博望二師之所得者又將特異遂附會之此説有見又云其幹臞者廉也節堅者剛也枝弱者謙也葉多蔭者仁也蔓而不附者和也實中果可啖者才也味甘平無毒入藥力勝者用也屈伸以時者道也其德之全有如此者豫謂中果入藥分才用似未穩屈伸以時人亦難曉蓋京師種葡萄者冬則盤屈其幹而庇覆之春則發其庇而引之架上故云然此蓋或種於庭或種於園所種不多故為之屈伸如此若山西及甘涼等處深山大谷中遍地皆是誰復屈之伸之皇宋第十六飛龍元朝降封瀛國公元君召公尚公主時承錫宴明光宫酒酣伸手扒金柱化為龍爪驚天容元君含笑語羣臣鳯雛寧與凡禽同侍臣獻謀將見除公主泣淚沾酥胸幸脫虎口走方外易名合尊沙漠中是時明宗在沙漠締交合尊情頗濃合尊之妻夜生子明宗隔帳聞笙鏞乞歸行宫飬為嗣皇考崩時年甫童元君降詔移南海五年乃歸居九重憶昔宋祖受周禪仁義綽有三代風至今兒孫主沙漠吁嗟趙氏何其隆此詩舊録於鄉人過指揮問其所從來云得之上虞布衣𡊮鉉未知何人作也後於王元直學正家閲福建閩縣志書始知為閩人俞應則所作若其事則備載錢塘翟宗吉歸田詩話及𡊮忠徹符臺外稿然忠徹以此為虞伯生作則非也玩味詩中至今兒孫主沙漠之句似言元君避歸沙漠後事應則其國初人與本朝自己巳之變各邉防守之寄益周於前如各方靣有險要者俱設鎮守太監總兵官巡撫都御史各一員下人名為三堂宣府大同遼東陜西三邉又有協守分守遊擊等官其制尤為縝密但近來添設頗多姑舉北直𨽻言之如薊州永平山海等處密雲古北等處居庸關等處各有鎮守內官鮎魚石等營黃崖口等營臺頭營山海等處永平太平寨青山營蛾眉山營遵化灤陽等關劉家口等處黃花鎮紫荆關倒馬關凡二十四處各有守備內官武官稱是夫武官分布要害遇有警急各任其責內官之設既非令典今以數百里之地其多如許况此輩原無祿食太平之時日費頗豐不免取諸所部孰敢誰何萬一事起不測折衝禦侮必賴將臣彼亦無能為也或犯吏議朝廷又多原之軍力之疲敝軍政之不修有由然矣朝廷盛禮慶成宴其一也而禮官多因時遷就不愜公論識者不能無議焉成化間泰和楊導叔簡為尚寶卿有以六品七品位其上者叔簡貽書葉文莊公有云慶成之宴非所以酬講讀之勞榮有事也中左之序非所以彰彈劾之能念駿奔也而票名之設戾於告示亦愚弄賢士矣暗定之計形於手本豈非尊禮勢要乎以經筵為講讀之官則符寶所司蓋實密務况其間有去翰林而任春坊者以給舍為近侍之列則尚寶正官實非外屬又其間有正七品從七品之異乎不肖承乏近侍草載有餘每以司丞列於銀臺棘寺之亞今以正卿班於經筵給事之後豈有司倉卒所致而不加思乎事有因時損益者必不悖朝廷莫如爵之訓禮有緣人情起者豈亦恃君子無所爭而為云云叔簡與文莊素厚而必貽之書者亦庶幾其能行之乎城隍之在祀典古無之後世以高城深池捍外衛內必有神主之始有祠事惑於理者衣冠而肖之加以爵號前代因襲其來久矣洪武元年各處城隍神皆有監察司民之封府曰公州曰侯縣曰伯且有制詞蓋其時皇祖尚未有定見三年乃正祀典詔天下城隍神主止稱某府城隍之神某州城隍之神某縣城隍之神前時爵號一切革去未幾又令各處城隍廟內屏去間雜神道城隍神舊有泥塑像在正中者以水浸之泥在正中壁上卻畫雲山圖神像在兩廊者泥在兩廊壁上此令一行千古之陋習為之一新惜乎今之有司多不逹此往往望為衣冠之像甚者又為夫人以配之習俗之難變愚夫之難曉遂使皇祖明訓託之空言可罪也哉釋迦生周昭王二十四年四月八日中國人奉佛教者於是日祀其神周正建子四月即今之二月也今以夏正四月八日為佛生日非也此説出臞仙最為有見然今朝中以四月八日為佛節賜百官喫不落莢莫有覺其非者天順七年二月十二日兵部奉特旨遣使臣下旱西洋曰哈哩地靣曰賽瑪爾堪地靣曰哈什噶爾地靣曰阿蘇地靣曰吐魯番地靣曰哈密地靣曰竒木加色稜處各正副使一員皆外夷人仕中朝者或大通事或都督或都指揮等官皆有主名矣居無幾何寢而不行或云李文逹公之力也此事一行朝廷爵賞靡費固不可言而沿途軍民勞苦損費亦何紀極况異時啓釁又未可知使此事果自李公而止正所謂仁人之言也諸司官御前承旨皆曰阿其聲引長老子云唯之與阿相去幾何則阿為應辭其來逺矣京營之制國初止有五軍營五軍者中軍左掖右掖左哨右哨也此外有曰大營曰圍子手曰幼官舍人營曰十二營皆五軍營之支分每營各有坐營把總官多寡不等永樂初始以龍旗寶纛下三千蒙古人立三千營內有坐營管操上直披眀甲等官又有隨侍營則三千營之支分也亦有坐營官以統之神機營永樂中征交址得其神機火箭之法因立是營亦有中軍左右掖左右哨各有坐營把司把牌官又有曰五千下者永樂中得都督談廣馬五千匹今所謂談家馬者即此别有坐營把司官統之此則神機營之支分也已上舊名三大營至成化初年以言者議選取三大營精兵設立團營十二曰奮武曰耀武曰練武曰顯武曰敢勇曰果勇曰效勇曰鼓勇曰立威曰伸威曰掦威曰振威每營各有坐營把總官統之遇出征即量調以行三大營所存無幾名曰老家兒專備營造差撥等用十二團營精兵在京各衛并在外各都司所屬及南北直隸衛所共二十五萬分為春秋二班圑操聽調此京營制度之大略也平江侯陳公豫鎮守臨清日館客作詩有簷前絡緯啼之句侯謂草蟲不可言啼遂疏之不知絡緯啼李太白已道之矣客終無以自明二人蓋未嘗讀李詩故也成化間有吏建言時事禮科給事中忌之以激厲風俗之厲不從力參送法司問罪不知厲本古字漢書凡云風厲勉厲皆不從力此吏亦不能自明二人蓋未嘗讀漢書故也兵科給事中閲兵部題本以伎不從女呼吏笞之翌旦有不平者令受笞吏執韻書以進乃赧顔慰遣之此蓋識俗字不識古字故也凡遇人文字所見未的輒疵議之後能無悔也乎青州生員古清恃才妄作凌虐鄉里死葬後人發其尸支解之懸於林木濬縣王都憲越之父既葬被發而喪其元求之不得乃刻木以代而葬之後食醬至甕底其元在焉王以是終身不食醬嘗聞之僚長張文謹云嘗聞火雞食火犀食棘刺野羊刳腹取脂脂復生又見列子等書言昆吾之劔切玉如泥火浣之布入火愈鮮不灰之木火爇不壞皆未之信近日滿剌加國貢火雞軀大於鶴毛羽雜生好食燃炭駕部貟外郎張汝弼親見之甘肅之西有叨羊取脂復生聞之高陽伯李文及彼處奏事人云然犀之食棘刺則豫所親見也火浣布友人凌季行有一縷如指不灰木譯史劉楩有束帶以火驗之信然由是觀之切玉之劔蓋或有之特未之見耳聞都御史朱公英云廣東海鯊變虎近海處人多掘岸為坡候其生前二足緣坡而上則襲取食之若四足俱上坡則能食人而不可制矣又聞按察使孔公鏞云廣西蚺蛇其大者皮甲鱗皴雜生苔蘚與山石無辨獐鹿誤從摩癢則掉尾絞而吞之土人取其膽則轉腹令取略不傷嚙後復遇人取膽仍轉腹以瘢示之人知其然亦不復害也十三道御史與六部各司平行文移謂之手本御史有欠謹厚者頗以言路自恃署名字文寸許一郎官厭之貽之口占云諸葛大名垂宇宙今人名大欲如何雖於事體無妨礙只恐文房費墨多諸司傳聞以為談笑大書之風由是稍息或云郎官為王兵侍偉嘗閲舊簿書正統景泰間會議五府六部都察院大理寺通政司之外有閣老及掌科無掌道官今有十三道而閣老不與聞始自李文逹公上請而然各道與議不知始何時景泰間各邉鎮守巡撫官會本奏事及兵部覆奏皆以總兵官為首今皆首內臣天順以前公侯伯都督管營者止稱坐營官總兵之名乃下人私相稱謂移文中無之其以總兵自稱則近年始及汪直用事時邉方事皆令兵部與總兵官計議則總兵之稱又出自御筆矣蓋內閣大臣非止養望而已廟堂謀議非所辱也御史職主紏察一與會議雖謬誤不復可言矣拉使與議殆以箝其口耳各邊總兵挂將軍印奉制敕得專生殺之柄宜非他官之所當先今朝鮮國王咨文惟咨遼東總兵官是已律中所謂總兵官蓋指挂印征進者若京師六軍總於天子非臣下所得而專制也此皆故事之因時而異者然一成而不可變矣蘇州自漢歷唐其賦皆輕宋元豐間為斛者止三十四萬九千有竒元雖互有增損亦不相逺至我朝止增崇明一縣耳其賦加至二百六十二萬五千九百三十五石地非加闢於前穀非倍收於昔特以國初籍入偽吳張士誠義兵頭目之田及撥賜功臣與夫豪強兼併沒入者悉依租科稅故官田每畝有九斗八斗七斗之額吳民世受其患洪武間運糧不逺故耗輕易舉永樂中建都北平漕運轉輸始倍其耗由是民不堪命逋負死亡者多矣宣宗明燭是弊詔官田減稅三分時格於國用不足之議事遂不行郡守况鍾抗章上請得遵優旨共減稅糧七十二萬餘石又得巡撫周文襄公存恤惠養二十餘年嵗豐人和汔可小康自後水旱相仍無嵗無之加以運漕虧折陪貱不訾民復困瘁况沿江傍湖圍分時多積水數年不耕不穫而小民破家鬻子嵗償官稅者類皆重額之田此吳民積久之患也京師巨剎大興隆大隆福二寺為朝廷香火院餘有賜額者皆中官所建寺必有僧官主之中官公出必於其寺休憩巧宦者率預結僧官俟其出則往見之有所請託結納皆僧官為之關節近時大臣多與僧官交歡者以此京衛武學之東智化寺大監許安輩以奉王振香火者天順間主之者僧官然勝讀書解文事時閻禹錫以國子監丞掌武學事勝則往拜焉禹錫托故不見他日饋茶餅卻之以詩投贈又卻之終始不與往還禹錫可謂剛介之士其賢於人逺矣湯都指揮胤績博學強記論議英發為詩文亦雄健有氣然性傲妄眼空時輩於朝士有一日之長輒以賢弟賢姪呼之人多不堪以其有時名不較也成化初言者以將材薦有才兼文武可當一靣之語戲者以湯一面名之陜西孤山頗號險要適參將貟缺兵部以胤績舉充即鎮未久有故人來謁呼酒共飲適報敵數騎薄城下胤績語故人云先生姑自酌吾往生擒畨雛來與觀也方出城未逺有畨伏溝中一箭中咽而斃人又名之曰湯一箭云此可以為將官夸大輕率之戒御史職司風紀中書舍人供奉絲綸其任皆不薄也名器之輕重衣冠之榮玷則繫其人焉近時一進士素出入閣老萬公之門得改翰林庶吉士萬病隂痿吉士自譽善醫具藥瀋為洗之因得為御史翌聖夫人之姪季通以門蔭官中舍一同寮濟寧人與通友善嘗得歸省以篋寄通所封鐍甚固夫人素諳世故命啓視之其人固辭夫人不許乃強啓之一篋有舊衣數件其下皆書籍一篋舊衣下皆土墼夫人大怒曰他日欲誣我家耶命歐之通跪請乃令自擔其二篋去時人為之語曰洗鳥御史挑土中書一時同官者氣為沮喪其辱敗士風甚矣文莊葉公巡撫兩廣時素與丘內翰仲深不合丘每投間毁之庚辰進士廣西張某嘗短葉於丘丘因為先容進謁李文逹言賊至城下葉猶詠詩不輟且殺無辜之民為功文逹素知葉公默識而已蓋張某歸省時葉嘗知其不檢踈之由是致怨丘之不察也丘素知文事非文逹所長且復護短乃謂葉笑其詩文不佳李公銜之他日錦衣吕指揮貴湯都指揮胤績盛稱葉公學問文章之美且云置之內閣於先生無忝文逹撫然曰與中笑我乃為入閣地耶及大藤峽用兵敕韓公雍書有云往者葉某虛張捷報致賊猖獗蓋張某先入之言至是始發也葉公後因言官之薦僅以右僉遷左僉而已文逹沒後始得入禮部云國初諸司皂隸主騶從而已宣德間始有納銀免役者聞宣廟因楊東里言京官祿薄遂不之禁名曰柴薪銀天順以來始以官品隆卑定立名數每嵗銀解部以巨萬計在京諸司皆出畿內并山東山西河南州縣南京諸司則皆出南畿州縣豫未第時見京官索皂銀意頗薄之及仕京乃知不可無也後官武庫嘗以為有害於義欲奏請改作折俸名色俸多而皂隸銀數不足者乃以鈔絹補數庶幾名正言順屬草時以此事屬兵部折俸屬户部事體窒礙不果行京師人家能蓄書畫及諸玩器盆景花木之類輒謂之愛清蓋其治此大率欲招致朝紳之好事者往來壯觀門户甚至投人所好而浸潤以行其私溺於所好者不悟也錦衣馮鎮撫珤中官家人也亦頗讀書其家玩器充聚與之交者以馮清士目之成化初為勘理鹽法差揚州城中舊家書畫玩器𬒳用計括掠殆盡濁穢甚矣吾鄉逹有為刑部郎者素與往還亦嘗𬒳其所賣馮死後人始言之凡居官者此等事亦不可不知也山西石州風俗凡男子未娶而死其父母俟鄉人有女死必求以配之議婚定禮納幣率如生者葬日亦復宴會親戚女死父母欲為贅壻禮亦如之三代至春秋時用兵率以車戰秦漢而後以騎兵為便故兵車之制車戰之法今皆不傳漢有武剛車晉有偏箱車然不過行載輜重止為營衛而已其出擊仍以騎兵故能制勝唐房琯擊安祿山用春秋車戰之法卒以取敗蓋春秋時敵國皆車戰又皆戰於平原廣野其兵將亦皆素練車戰之人故宜之琯以車祿山以騎時異勢殊故用有利鈍非車之罪也今中國行軍欲用車戰此最不通時宜者乃者都御史李公賔亦以戰車為言兵部重違其請嘗令成造試之不欲顯言其非苐云備用而已都御史王公越時提督京營或問戰車之名王云是名鷓鴣車蓋謂鷓鴣啼行不得也李聞而恚之成化間漕河築隄一石中斷中有二人作男女交媾狀長僅三寸許手足肢體皆分明若雕刻而成者高郵衛某指揮得之以獻平江伯陳公鋭鋭以為珍藏焉此等事雖善格物者莫能究其所以楊文貞公在內閣時夫人已早世惟一婢侍巾櫛而已一日中宫有喜慶文武大臣命婦皆朝賀太后聞公無命婦令左右召其婢至則諸命婦已退矣太后見其貌既不揚衣復儉陋命妃嬪重為梳整易內製首飾衣服而遣之且笑云此回楊先生不能認矣翌旦命所司如制封之不為例其眷遇之隆如此聞此即南京太常少卿導之母也導字叔簡能詩文善談論以尚寶卿升是官文徵明云文貞薨世時郭夫人猶在且不聞有封贈之説或他日以導推恩容或有之特粲按文貞元配嚴夫人繼郭夫人即此婢也朝廷降制封之其制詞載在文貞續集附録內安得云無此説也衡山公一時偶未之考耳詩螮蝀在東釋者以為天地之淫氣或以為日光射雨氣而成然今人露置酒醬於庭見虹則急掩蓋之不爾則致消耗相傳虹能食此嘗聞廣西杜監生云其家舍旁眢井時時出虹叔父頗健狠率僮掘之深丈餘見一肉塊大如釜無首尾蠕蠕而動欲煮之家人不可乃舉而投水中自是此處不復出虹矣虹霓螮蝀字皆從蟲古人制字必有所見又虹字北方人讀作岡去聲今吳中名鞭撻痕亦用此音其即此字耶占卦者以錢代蓍其來久矣舊以無字一面為陽有字一面為隂至朱文公反之以有字為面為陽無字為背為隂有儲氷者以為古銅器物欵識皆在背如鏡是已豫按此説非也錢之有文為錢設也今印信與宫衛銅牌皆然錢背間亦有一字者印背有鑄造年月字銅牌背有號數字若鏡之為器主照物不重在文豈可以此為律邪初過吕梁洪沽頭閘直沽不知洪沽字義後考之石阻河流為洪方言也又蜀人謂水口為洪梓潼水與涪江合流如箭故有射洪縣若沽乃漁陽水名今直沽雖與漁陽地相近然注云水出漁陽塞外東入海則又非矣所謂直沽沽頭蓋水道之通名亦方言如漊字本雨不絶貌今南方以為溝渠之名北人則不解道也病痔者用苦處菜或鮮者或乾者煮湯以熟爛為度和湯置器中閣一版其上坐以薰之候湯可下手撩苦􅀢頻頻揉洗湯冷即止日洗數次豫使宣府時曽患此疾太監弓勝授以此方洗數日後果見效故記之􅀢一作笸北方甚多南方亦有之故友支禧字有禎篤行之士嘗言星辰雲物天之章也今衣段織雲者庶民皆服之五糖七糖席面內有糖人是人食人也有賢者在位當禁之言雖迂甚有理致菽園雜記卷五
