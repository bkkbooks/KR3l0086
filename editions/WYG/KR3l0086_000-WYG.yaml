body:
  text: 菽園雜記小說家𩔖一雜事之屬提要臣等謹案菽園雜記十五卷明陸容撰容字文量號式齋太倉州人成化丙戌進士官至浙江右㕘政事迹具明史文苑傳史稱容與張泰陸釴齊名時號婁東三鳯其詩才不及泰釴而博學過之是編乃其劄録之文於明代朝野故實叙述頗詳多可與史相考證旁及談諧雜事皆並列簡編葢自唐宋以來説部之體如是也中間頗有考辨如元王栢作二南相配圖棄甘棠何彼穠矣野有死麕三篇於經義極為乖剌而容獨歎為卓識又文廟别作寢殿祀啓聖公而配以四配之父其議發于熊禾而容謂叔梁紇為主出於無謂孟孫激非聖賢之徒不當從祀尤昧於崇功報本之義皆不足為據然核其大致可採者較多王鏊嘗謂其門人曰本朝紀事之書當以陸文量為第一即指此書也雖無雙之譽奬借過深要其所以取之者必有在矣乾隆四十六年十一月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:ec3881b2e99510af14a42b4820cfc9b192cb4512aac877d3674f2efea31c144a
